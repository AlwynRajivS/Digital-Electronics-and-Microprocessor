{t:"IO devices & the interface",sh:"IO basics",pts:["Peripherals such as keyboards, CRT displays, printers and disks connect the microcomputer to the outside world.","Their characteristics differ from the microprocessor’s, so <b>interface hardware</b> is needed between them.","IO devices are slow, so they attach to the system bus through <b>ports</b>: buffer ICs that temporarily hold data.","Each port has its own address; the processor selects it by sending that address."],w:"flow"},

const INF={s3:{cpu:"8086 CPU: sends address, data and control signals on the system bus.",itf:"CPU interface: connects the CPU to the system bus and the ports.",bus:"System bus: carries data, address and control signals between the CPU and the ports.",ip:"Input port: buffer that holds data from the input device until the CPU reads it. It gets address and control signals from the system bus.",id:"Input device: slow device that sends data (and exchanges control signals) with the input port.",op:"Output port: buffer that holds the data from the CPU until the output device reads it.",od:"Output device: slow device that reads data from the output port and exchanges control signals with it."},

s18:{cpu:"8086 microprocessor.",lat:"Latches and buffers: provide the address bus A0–A19, the data bus D0–D15, BHE, RD and WR.",ram1:"8 kB RAM 6264 (odd bank): selected by OBCS0 from the first 2-to-4 decoder.",rom1:"8 kB EPROM 2764 (odd bank): selected by OBCS3.",ram2:"8 kB RAM 6264 (even bank): selected by EBCS0 from the second decoder.",rom2:"8 kB EPROM 2764 (even bank): selected by EBCS3.",p1:"8279 (memory mapped): its chip select EBCS1 comes from the memory decoder, so it sits in the memory address space with a 20-bit address.",p2:"8255 (memory mapped): its chip select EBCS2 comes from the memory decoder, so the CPU accesses it like a memory location.",d1:"2-to-4 decoder for the odd bank: A18 and A19 select the output, BHE enables it. Outputs OBCS0–3.",d2:"2-to-4 decoder for the even bank: A18 and A19 select the output, A0 enables it. EBCS0–3 select RAM, EPROM, 8279 and 8255."},
s20:{cpu:"8086 microprocessor.",lat:"Latches and buffers: provide A0–A19, D0–D15, BHE, RD, WR and M/IO.",ram1:"8 kb RAM 6264 (odd bank): chip select OBCS0 from the memory 3-to-8 decoder.",rom1:"8 kb EPROM 2764 (odd bank): chip select OBCS7.",ram2:"8 kb RAM 6264 (even bank): chip select EBCS0.",rom2:"8 kb EPROM 2764 (even bank): chip select EBCS7.",p1:"8279 (IO mapped): chip select IOCS0 from the separate IO decoder.",p2:"8255 (IO mapped): chip select IOCS1 from the separate IO decoder.",d1:"3-to-8 decoder for the odd bank: A17–A19 select, BHE and M/IO enable. Outputs OBCS0–7.",d2:"3-to-8 decoder for the even bank: A17–A19 select, A0 and M/IO enable. Outputs EBCS0–7.",d3:"Separate IO decoder: A5, A6, A7 select, A0 and M/IO enable it (+5 V on G1). IOCS0 → 8279, IOCS1 → 8255."}};
