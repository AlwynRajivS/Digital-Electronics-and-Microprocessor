const M=[
["What is an addressing mode?",()=>`<p>Every instruction operates on data. The method of specifying that data is called <b>addressing</b>; in short, it is the manner in which the operand is given in an instruction.</p><p>In <code>MOV BL,CL</code> the destination is BL and the source is CL.</p><div class="tip">The slide’s example <code>ADD BX,[AX]</code> is not a legal 8086 instruction: AX cannot hold a memory pointer. Only BX, BP, SI and DI can.</div><h3>The family tree</h3><div class="tree"><ul>${tr(TR)}</ul></div><p style="margin-top:14px">That gives 12 modes: register, immediate, direct, register indirect, based, indexed, based indexed, string, direct I/O port, indirect I/O port, relative and implied.</p>`],
["Register & immediate",()=>`<h3>Register addressing</h3><p>The instruction names the register that holds the data. AX, BX, CX and DX can be used as 16-bit registers or as 8-bit halves (AH/AL and so on).</p>${ex(0)}${ex(1)}<h3>Immediate addressing</h3><p>An 8-bit or 16-bit value is specified as part of the instruction itself.</p>${ex(2)}${ex(3)}<div class="tip">The slide says <code>MOV AX,0A9FH</code> moves data to “DL”; it is the 16-bit AX register that receives it.</div>`],
["From EA to memory address",()=>`<p>All the memory modes work out an <b>effective address (EA)</b>, which is an offset. The BIU then turns it into a 20-bit address:</p><div class="fm"><div>BA = segment × 10H<small>Base address of the segment (DS for most data)</small></div><div>MA = EA + BA<small>Memory address sent on the address bus</small></div></div><ul class="k"><li>A 16-bit word is stored <b>little endian</b>: the low byte at MA and the high byte at MA+1. That is why the slides write DL ← MA and DH ← MA+1.</li><li>Standard 8086 rule (not on the slides): addresses that use BP default to the stack segment (SS); the others default to DS.</li></ul><div class="tip"><b>Quick check:</b> DS = 2000H and EA = 0108H, so BA = 20000H and MA = 20108H.</div>`],
["Direct & register indirect",()=>`<h3>Direct addressing</h3><p>An unsigned 16-bit or signed 8-bit displacement is given in the instruction. The displacement <b>is</b> the EA.</p>${ex(4)}${ex(5)}<h3>Register indirect addressing</h3><p>The instruction names the register that holds the EA. Square brackets mean “the memory at this address”.</p>${ex(6)}${ex(7)}`],
["Based, indexed & based indexed",()=>`<div class="fm"><div>Based<small>EA = BX or BP + displacement</small></div><div>Indexed<small>EA = SI or DI + displacement</small></div><div>Based indexed<small>EA = base + index + displacement</small></div></div><h3>Based addressing</h3><p>BX or BP supplies the base value; a signed 8-bit or unsigned 16-bit displacement is added to it.</p>${ex(8)}${ex(9)}<h3>Indexed addressing</h3><p>The same idea with SI or DI as the index value.</p>${ex(10)}<h3>Based indexed addressing</h3><p>The EA is the sum of a base register (BX or BP), an index register (SI or DI) and a displacement.</p>${ex(11)}`],
["String addressing",()=>`<p>Used by string instructions. The EA of the <b>source</b> is in <b>SI</b> (data segment) and the EA of the <b>destination</b> is in <b>DI</b> (extra segment).</p>${ex(12)}<p>After the copy, the Direction Flag decides how the pointers move:</p><ul class="k"><li>DF = 0: SI ← SI + 1 and DI ← DI + 1</li><li>DF = 1: SI ← SI − 1 and DI ← DI − 1</li></ul><p>Try it: open the Practice lab, pick <code>MOVS BYTE</code> and change DF.</p>`],
["I/O port addressing",()=>`<h3>Direct I/O port</h3><p>Used to reach a standard I/O-mapped device. The port address is part of the instruction.</p>${ex(13)}<h3>Indirect I/O port</h3><p>The instruction names the register that holds the port address. On the 8086 that register is DX.</p>${ex(14)}<div class="tip">The slides write <code>IN AL,[09H]</code>; assemblers expect <code>IN AL,09H</code>, which is what the example above shows.</div>`],
["Relative & implied",()=>`<h3>Relative addressing</h3><p>The target is specified relative to the Instruction Pointer by an 8-bit <b>signed</b> displacement. It is used by jump instructions such as JZ.</p>${ex(15)}<p>Now the same instruction when the flag is clear:</p>${ex(15,{ZF:0})}<h3>Implied addressing</h3><p>The instruction itself specifies the data to be operated on, so there is no operand to write.</p>${ex(16)}`],
["Cheat sheet",()=>`<div class="tw"><table><tr><th>Mode</th><th>Example</th><th>Rule</th></tr>${MODES.map(m=>`<tr><td>${m[0]}</td><td><code>${m[2]}</code></td><td>${m[1]}</td></tr>`).join("")}</table></div><div class="tip" style="margin-top:14px">Next: run the examples yourself in the Practice lab, then take the assessment.</div>`]];
