<title>8086 Lab – Learn, Practice, Assess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1F4;--sf:#fff;--sf2:#E3E9EE;--ln:#C9D4DC;--ink:#0E2231;--mu:#4C6575;--ac:#A85F00;--onac:#fff;--tr:#0B7285;--ok:#167A45;--bad:#C0392B;--sh:0 8px 28px rgba(14,34,49,.10);
--fd:"Bricolage Grotesque",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1822;--sf:#12232F;--sf2:#182E3C;--ln:#27424F;--ink:#E6EEF2;--mu:#93ABB8;--ac:#F0B45A;--onac:#0C1822;--tr:#5CC8D7;--ok:#5FD08F;--bad:#FF7A6B;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1822;--sf:#12232F;--sf2:#182E3C;--ln:#27424F;--ink:#E6EEF2;--mu:#93ABB8;--ac:#F0B45A;--onac:#0C1822;--tr:#5CC8D7;--ok:#5FD08F;--bad:#FF7A6B;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--fd);min-height:100%;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800}h3{font-size:1.1rem;font-weight:600}
p{margin:0 0 1em;max-width:70ch}code,.m{font-family:var(--fm)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tr);outline-offset:2px;border-radius:6px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}
.logo svg{width:30px;height:30px}
nav.top{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;padding:8px 16px;border-radius:99px;font-weight:600;color:var(--mu)}

#theme{margin-left:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}
#theme svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2}

section[hidden]{display:none}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.btn{background:var(--ac);color:var(--onac);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn.g{background:var(--sf2);color:var(--ink);border:1px solid var(--ln)}.btn:disabled{opacity:.45;cursor:not-allowed}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:800;margin-bottom:.3em}
.hero p{color:var(--mu);font-size:1.1rem}
.die{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;display:grid;gap:10px;box-shadow:var(--sh)}
.die .u{border:2px solid var(--tr);border-radius:12px;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.die .u.e{border-color:var(--ac)}.die small{color:var(--mu);font-weight:400}
.q{display:flex;gap:5px}.q i{width:22px;height:22px;border-radius:5px;background:var(--sf2);border:1px solid var(--ln);animation:fl 3.6s infinite}
.q i:nth-child(2){animation-delay:.3s}.q i:nth-child(3){animation-delay:.6s}.q i:nth-child(4){animation-delay:.9s}.q i:nth-child(5){animation-delay:1.2s}.q i:nth-child(6){animation-delay:1.5s}
@keyframes fl{0%,35%{background:var(--tr);border-color:var(--tr)}50%,100%{background:var(--sf2);border-color:var(--ln)}}
/* learn */
.lg{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.mods{display:grid;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.mods button{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:600}
.mods button[aria-current=true]{border-color:var(--ac);box-shadow:inset 4px 0 0 var(--ac)}
.mods .dot{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--ln);flex:none}.mods .done .dot{background:var(--ok);border-color:var(--ok)}
.prog{height:8px;background:var(--sf2);border-radius:9px;overflow:hidden;margin-bottom:6px}.prog i{display:block;height:100%;background:var(--tr);width:0;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--sf2);border-radius:12px;padding:12px}.stat b{display:block;font:600 1.35rem var(--fm);color:var(--tr)}.stat span{font-size:.85rem;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lg>*,.hero>*,.two>*{min-width:0}
body{overflow-x:hidden}
ul.k{padding-left:1.1em;margin:0 0 1em}ul.k li{margin:.3em 0}
.tip{border-left:4px solid var(--ac);background:var(--sf2);padding:12px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:420px}
td,th{padding:9px 12px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}tr:last-child td{border:0}td:first-child{font:600 .95rem var(--fm);color:var(--ac);white-space:nowrap}
.fs{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:10px 0;font:600 .7rem var(--fm);text-align:center}
.fs span{padding:8px 0;border-radius:6px;background:var(--sf2);color:var(--mu)}.fs .c{background:var(--tr);color:var(--bg)}.fs .t{background:var(--ac);color:var(--onac)}
.mem{position:relative;height:46px;background:var(--sf2);border-radius:10px;margin:36px 0 26px;border:1px solid var(--ln)}
.mem b{position:absolute;top:0;bottom:0;display:grid;place-items:center;font:600 .8rem var(--fm);background:var(--tr);color:var(--bg);border-radius:6px;min-width:26px}
.mem b.cs{background:var(--ac);color:var(--onac)}.mem em{position:absolute;top:50px;font:.65rem var(--fm);color:var(--mu);font-style:normal;transform:translateX(-30%)}
.dgw{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:#fff}.dg{position:relative;min-width:680px;overflow:hidden}.dgw{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 70px)}.dg img{display:block;width:100%;height:auto}
.hl{position:absolute;border:3px solid #E0245E;border-radius:8px;box-shadow:0 0 0 9999px rgba(255,255,255,.55);transition:all .35s;pointer-events:none;opacity:0}.hl.on{opacity:1}
.hots{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}.hots button{border:1px solid var(--ln);background:var(--sf2);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.9rem}.hots button[aria-pressed=true]{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.hint{font-size:.85rem;color:var(--mu);margin:6px 0 0}.dd{min-height:84px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,12,18,.88);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}#lb[hidden]{display:none}
.lbs{flex:1;overflow:auto;background:#fff;border-radius:12px;margin-top:10px;-webkit-overflow-scrolling:touch}.lbs img{display:block;width:160%;min-width:900px;max-width:none;height:auto}
.dgb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
/* practice */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}.tabs button{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:8px 16px;font-weight:600}
.tabs button[aria-selected=true]{background:var(--tr);color:var(--bg);border-color:var(--tr)}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}input,select{font:600 1.1rem var(--fm);padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:12px 0}
.out{font:600 clamp(1.6rem,6vw,2.6rem) var(--fm);color:var(--ac);word-break:break-all}.sub{font:.9rem var(--fm);color:var(--mu);word-break:break-all}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:12px}
.chip{border:2px solid var(--ln);border-radius:12px;padding:10px;text-align:center;font:600 .8rem var(--fm);color:var(--mu)}.chip b{display:block;font-size:1.5rem}.chip.on{border-color:var(--ac);color:var(--ac);background:var(--sf2)}
.qs{display:flex;gap:6px;margin:14px 0;min-height:30px}.qs span{flex:1;height:44px;border-radius:8px;border:1px dashed var(--ln);display:grid;place-items:center;font:600 .8rem var(--fm)}.qs .f{background:var(--tr);color:var(--bg);border:0}
.flip{perspective:900px;height:200px;cursor:pointer;width:100%;border:0;background:none;padding:0}.fi{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}.flip.o .fi{transform:rotateY(180deg)}
.fi>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--ln);display:grid;place-items:center;padding:20px;text-align:center;background:var(--sf2)}
.fi .b{transform:rotateY(180deg);background:var(--sf);border-color:var(--ac)}.fi .a{font:800 3rem var(--fm);color:var(--ac)}
/* assess */
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--ln);border-radius:12px;padding:12px 14px;margin:8px 0;font-weight:600}
.opt:hover{border-color:var(--tr)}.opt[aria-checked=true]{border-color:var(--ac);background:var(--sf2)}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font:800 2.4rem var(--fm);background:conic-gradient(var(--tr) calc(var(--p)*1%),var(--sf2) 0)}.ring span{width:118px;height:118px;border-radius:50%;background:var(--sf);display:grid;place-items:center}
.rv{padding:12px 0;border-bottom:1px solid var(--ln)}.rv .ex{color:var(--mu);font-size:.92rem}.tag{font:600 .8rem var(--fm)}.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.bn{display:none}
@media (max-width:760px){
 .hero,.lg,.two{grid-template-columns:minmax(0,1fr)}.dg{min-width:0}table{min-width:0}td:first-child{white-space:normal}
 .tabs button,.mods button,.btn,.nav2 .btn,.hots button{min-height:44px}.card{padding:16px}.hero{gap:18px;margin-bottom:20px}
 #theme{width:44px;height:44px}.ring{width:120px;height:120px}.ring span{width:92px;height:92px;font-size:1.8rem}
 .flip{height:230px}.qs span{height:38px;font-size:.7rem}.chips{grid-template-columns:repeat(3,1fr)}.opt{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.stat b{font-size:1.1rem}

 .hero,.lg,.two{grid-template-columns:1fr}.mods{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:6px}.mods button{white-space:nowrap}
 nav.top{display:none}main{padding-bottom:96px}.logo span{font-size:1.05rem}#theme{margin-left:auto}
 .bn{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sf);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
 .bn button{flex:1;background:none;border:0;padding:10px 0;font-weight:600;color:var(--mu);border-radius:10px}.bn button[aria-current=page]{color:var(--ac);background:var(--sf2)}
 .fs{grid-template-columns:repeat(8,1fr);font-size:.7rem}
}
@media (max-width:380px){h2{font-size:1.4rem}}@media (max-width:330px){.logo span{display:none}.stats{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header><div class="bar">
 <div class="logo"><svg viewBox="0 0 32 32" fill="none" stroke="var(--ac)" stroke-width="2"><rect x="8" y="8" width="16" height="16" rx="3"/><path d="M12 4v4M16 4v4M20 4v4M12 24v4M16 24v4M20 24v4M4 12h4M4 16h4M4 20h4M24 12h4M24 16h4M24 20h4"/><circle cx="16" cy="16" r="3" stroke="var(--tr)"/></svg><span>8086 Lab</span></div>
 <nav class="top" aria-label="Sections"><button data-go="learn">Learn</button><button data-go="practice">Practice</button><button data-go="assess">Assess</button></nav>
 <button id="theme" aria-label="Switch between light and dark theme"><svg viewBox="0 0 24 24" id="ti"></svg></button>
</div></header>
<main>
<section id="learn">
 <div class="hero"><div><h1>The 8086, one unit at a time.</h1><p>Intel’s 16-bit processor that runs fetch and execute in parallel. Study eight short modules, test yourself in the lab, then take the 20-question assessment.</p>
 <button class="btn" data-go="learn" onclick="openMod(0)">Start module 1</button></div>
 <div class="die" aria-hidden="true"><div class="u"><span>Bus Interface Unit <small>fetches</small></span></div><div class="q"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="u e"><span>Execution Unit <small>decodes &amp; executes</small></span></div></div></div>
 <div class="lg"><div><div class="prog" role="progressbar" aria-label="Modules completed"><i id="pg"></i></div><small id="pgt" class="m"></small><div class="mods" id="mods" style="margin-top:10px"></div></div>
 <article class="card" id="mod" tabindex="-1"></article></div>
</section>

<section id="practice" hidden>
 <h2>Practice lab</h2><div class="tabs" role="tablist" id="ptabs"></div><div id="pbody"></div>
</section>

<section id="assess" hidden>
 <h2>Assessment</h2><div class="card" id="abody"></div>
</section>
</main>
<div id="lb" hidden role="dialog" aria-label="Architecture diagram, enlarged"><button class="btn" id="lbx" onclick="zoomD(0)">Close</button><div class="lbs"><img id="lbi" alt="8086 architecture block diagram, enlarged"></div></div>
<nav class="bn" aria-label="Sections"><button data-go="learn">Learn</button><button data-go="practice">Practice</button><button data-go="assess">Assess</button></nav>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],hx=(n,l=0)=>n.toString(16).toUpperCase().padStart(l,"0");
const store={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* ---------- theme ---------- */
const sun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>',moon='<path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/>';
function curTheme(){const t=document.documentElement.dataset.theme;return t||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}
function setIcon(){$("#ti").innerHTML=curTheme()==="dark"?sun:moon}
$("#theme").onclick=()=>{const n=curTheme()==="dark"?"light":"dark";document.documentElement.dataset.theme=n;store.s("th",n);setIcon()};
{const t=store.g("th",null);if(t)document.documentElement.dataset.theme=t;setIcon()}
/* ---------- data ---------- */
const R=[["AX","Accumulator pair. Stores the 16-bit result of certain arithmetic and logic operations. (AL is the accumulator.)"],["BX","Holds the base value in base addressing mode to access memory data."],["CX","Holds the count value in SHIFT, ROTATE and LOOP instructions."],["DX","Holds data for multiplication and division."],["SP","Stack pointer. Offset address of the data at the top of the stack segment."],["BP","Base pointer. Offset of data to be read from or written into the stack segment."],["SI","Source index. Offset of source data in the data segment during string instructions."],["DI","Destination index. Offset of destination data in the extra segment during string instructions."]];
const FL=[["CF","Carry","Set on a carry out of the MSB in addition, or a borrow in subtraction.","c"],["PF","Parity","Set to 1 if the lower byte of the result has an even number of 1s; 0 for an odd number.","c"],["AF","Auxiliary carry","Set if there is a carry from the low nibble to the high nibble of the low-order byte.","c"],["ZF","Zero","Set to 1 if the result is zero; cleared for a non-zero result.","c"],["SF","Sign","Set to 1 if the MSB of the result is 1; cleared for a non-negative result.","c"],["OF","Overflow","Set to 1 if there is an arithmetic overflow.","c"],["DF","Direction","Used by string instructions. 0 = process from lowest to highest address (auto-increment). 1 = highest to lowest (auto-decrement).","t"],["IF","Interrupt","Lets the 8086 recognise external maskable interrupts; clearing IF disables them.","t"],["TF","Trace","When set, the CPU enters single-step mode, generating an internal interrupt after every instruction.","t"]];
const bits=["-","-","-","-","OF","DF","IF","TF","SF","ZF","-","AF","-","PF","-","CF"];
const M=[
["Meet the 8086",()=>`<p>Intel launched the 8086 in 1978. It is a 16-bit microprocessor.</p>
<div class="stats"><div class="stat"><b>16-bit</b><span>data bus, D0–D15</span></div><div class="stat"><b>20-bit</b><span>address bus, A0–A19 → 2²⁰ = 1 MB</span></div><div class="stat"><b>64K</b><span>I/O ports (2¹⁶)</span></div><div class="stat"><b>14</b><span>16-bit registers</span></div><div class="stat"><b>2.5 MIPS</b><span>about 400 ns per instruction</span></div><div class="stat"><b>5·8·10 MHz</b><span>8086, 8086-2, 8086-3</span></div></div>
<ul class="k"><li>Memory is organised as two 512 KB banks (512 KB + 512 KB = 1 MB): the <b>even (lower)</b> bank and the <b>odd (upper)</b> bank.</li><li>The bus is multiplexed: AD0–AD15 carry address and data, and A16–A19 carry the upper address bits.</li><li>It needs a single-phase clock with a 33% duty cycle for optimised internal timing.</li></ul>
<div class="tip"><b>Check the maths:</b> time per instruction = 1 / MIPS = 1 / (2.5 × 10⁶) = 400 ns.</div>`],
["Two units, one pipeline",()=>`<p>The 8086 has a pipelined (parallel) architecture. Its CPU has two parts that operate at the same time, doing the three CPU jobs: fetch, decode and execute.</p>
<div class="two"><div class="card"><h3>Bus Interface Unit (BIU)</h3><ul class="k"><li>Sends out addresses for memory locations</li><li>Fetches instructions from memory</li><li>Reads and writes data to memory</li><li>Sends out addresses for I/O ports</li><li>Reads and writes data to I/O ports</li></ul></div><div class="card"><h3>Execution Unit (EU)</h3><ul class="k"><li>Tells the BIU where to fetch instructions or data</li><li>Decodes and executes instructions</li></ul></div></div>
<h3 style="margin-top:18px">Pipelining</h3><p>Fetching the next instruction while the current one executes is called <b>pipelining</b>. The EU does not wait for the BIU to fetch the next instruction byte, because a queue holds it ready. Dividing the work between BIU and EU speeds up processing.</p>`],
["Architecture diagram",()=>`<p>Here is the full 8086 block diagram. The dashed line splits the <b>Execution Unit</b> (left) from the <b>Bus Interface Unit</b> (right). Tap a part below to highlight it and read what it does.</p><div class="dgw"><div class="dg"><img src="${IMG}" alt="8086 architecture block diagram showing the Execution Unit and Bus Interface Unit" width="1280" height="720"><div class="hl" id="hl"></div></div></div><div class="tip dd" id="dd" aria-live="polite">Choose a block to see its job.</div><div class="dgb"><button class="btn g" onclick="zoomD()">Zoom diagram</button><span class="hint">Opens a larger view you can scroll and pinch.</span></div><div class="hots" id="hots">${D.map((d,i)=>`<button aria-pressed="false" onclick="hot(${i})">${d[0]}</button>`).join("")}</div>`],
["Execution Unit",()=>`<p>The EU has five main parts:</p><ul class="k"><li><b>Internal control system</b> (instruction decoder): translates fetched instructions into a series of actions, and generates timing and control signals for internal operations.</li><li><b>Arithmetic Logic Unit (ALU):</b> 16-bit; can ADD, subtract, AND, OR, increment, decrement, complement or shift binary numbers.</li><li><b>General purpose registers</b></li><li><b>Flag register</b></li><li><b>Pointer and index registers</b> (offset registers)</li></ul><div class="tip">The EU never touches the buses directly. It asks the BIU to do that.</div>`],
["General-purpose registers",()=>`<p>The EU has 8 general-purpose registers. Each of AX, BX, CX and DX can be used as two 8-bit halves (AH/AL, BH/BL, CH/CL, DH/DL) or combined as a 16-bit register. <b>AL is also called the accumulator.</b> SP, BP, SI and DI are 16-bit.</p><div class="tw"><table><tr><th>Register</th><th>Job</th></tr>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table></div>`],
["Flag register",()=>`<p>The 8086 has a 16-bit flag register with <b>9 active flags</b>: six conditional flags (set or reset by the EU from arithmetic results) and three control flags (which steer the processor).</p><div class="fs">${bits.map((b,i)=>{const f=FL.find(x=>x[0]===b);return`<span class="${f?f[3]:""}">${b}</span>`}).join("")}</div><div class="tw"><table>${FL.map(f=>`<tr><td>${f[0]}</td><td><b>${f[1]}</b> ${f[3]=="c"?"(conditional)":"(control)"}<br>${f[2]}</td></tr>`).join("")}</table></div>`],
["Instruction queue & the BIU",()=>`<p>The BIU’s main components are the <b>instruction queue</b>, the <b>segment registers</b> and the <b>instruction pointer</b>.</p><ul class="k"><li>While the EU is busy decoding or executing, the buses may be idle.</li><li>The BIU then uses them to pre-fetch up to <b>six instruction bytes</b>.</li><li>The bytes wait in a FIFO register, the instruction queue.</li><li>When the EU is ready, it simply reads its next instruction from the queue.</li></ul><div class="tip">Try it: the <b>Queue</b> tool in Practice lets you play BIU and EU.</div>`],
["Memory segmentation",()=>`<p>A 20-bit address bus reaches 1 MB, but the 8086 works with only <b>four 64 KB segments</b> at a time:</p><div class="mem" aria-label="Memory map"><b style="left:12.5%;width:6.25%">DS</b><b class="cs" style="left:20.5%;width:6.25%">CS</b><b style="left:31.25%;width:6.25%">SS</b><b style="left:43.75%;width:6.25%">ES</b><em style="left:12.5%">20000H</em><em style="left:20.5%;top:62px">348A0H</em><em style="left:31.25%">50000H</em><em style="left:43.75%;top:62px">70000H</em><em style="right:0;transform:none">FFFFFH</em></div>
<ul class="k"><li><b>Code segment (CS):</b> where the BIU is currently fetching instruction bytes.</li><li><b>Data (DS) and extra (ES) segments:</b> store data values used by the program.</li><li><b>Stack segment (SS):</b> memory set aside to hold addresses and data while a subprogram executes.</li></ul>
<p>A segment register stores only the <b>upper 16 bits</b> of the 20-bit start address. The BIU appends four zero bits, so a segment always starts at an address divisible by 16. Example: CS = 348AH means the code segment starts at 348A0H.</p><div class="tip">Segments are <b>up to 64 KB</b> (the slide says “64 bytes”, which is a typo) and can be as small as one byte.</div>`],
["Physical address",()=>`<p>The BIU builds every 20-bit address from a segment register and a 16-bit offset:</p><div class="card" style="text-align:center"><div class="out" style="font-size:1.5rem">PA = (segment × 16) + offset</div></div>
<ul class="k"><li><b>IP</b> (16-bit) holds the offset of the next instruction byte in the code segment. The BIU uses CS:IP.</li><li><b>SS</b> (in the BIU) holds the stack segment’s upper 16 bits; <b>SP</b> (in the EU) is the offset to the top of stack.</li><li><b>BP, SI, DI</b> can store temporary data, but mainly hold a 16-bit offset of a data word in a segment.</li></ul>
<div class="tip"><b>Worked example:</b> CS = 348AH, IP = 4214H → 348A0H + 4214H = <b class="m">38AB4H</b>. Check it in the address calculator.</div><button class="btn" onclick="go('practice')">Open practice lab</button>`]];

const D=[["Registers (EU)",21.9,2.8,20.3,35.4,"AX, BX, CX and DX can be used as 8-bit halves (AH/AL and so on) or as 16-bit registers. SP, BP, DI and SI are 16-bit pointer and index registers."],["Temporary register",14.8,47.9,20.5,7,"Holds an operand on its way into the ALU."],["ALU",14.8,58.3,20.3,16.7,"The 16-bit ALU can ADD, subtract, AND, OR, increment, decrement, complement or shift binary numbers."],["Flag register",17.8,83.3,15,6.9,"16-bit register with 9 active flags: six conditional flags set by the ALU result, three control flags."],["Control system",40.6,73.3,10.7,19.7,"Decodes instructions read from the queue and generates timing and control signals for internal operations."],["Instruction queue",61.1,80.6,20.2,8.3,"A FIFO that pre-fetches up to six bytes. The EU reads from it over the 8-bit Q bus, so it rarely waits for memory."],["Segment regs + IP",61.1,33.6,20.2,27.1,"CS, DS, SS and ES hold the upper 16 bits of each segment’s start address. IP holds the offset of the next instruction byte."],["Address generation",62.9,13.9,18.4,14.6,"Computes PA = Seg × 10H + IP (10H is 16), producing the 20-bit physical address for the address bus."],["Bus control logic",84.8,55.1,9,16.4,"Connects the BIU to memory and I/O: it drives the buses and moves instruction bytes into the queue."]];

const P=[["Address calculator",()=>`<div class="card"><h3>Segment:offset → physical address</h3><div class="row"><label>Segment (hex)<input id="sg" value="348A" maxlength="4" inputmode="text"></label><label>Offset (hex)<input id="of" value="4214" maxlength="4"></label></div><div class="sub">Segment × 16 (append a hex zero)</div><div class="sub" id="a1"></div><div class="out" id="a2"></div><div class="sub" id="a3"></div><p id="a4" style="margin-top:10px;color:var(--mu)"></p></div>`,()=>{const f=()=>{const s=parseInt($("#sg").value,16),o=parseInt($("#of").value,16);if(isNaN(s)||isNaN(o)){$("#a1").textContent="";$("#a2").textContent="Enter hex digits";$("#a3").textContent="";$("#a4").textContent="";return}const base=s*16,pa=(base+o)&0xFFFFF;$("#a1").textContent=hx(base,5)+"H  (segment starts here)";$("#a2").textContent=hx(pa,5)+"H";$("#a3").textContent=pa.toString(2).padStart(20,"0").replace(/(.{4})/g,"$1 ").trim();$("#a4").textContent=base+o>0xFFFFF?"The sum passes FFFFFH, so the address wraps around within 1 MB.":"Segment spans "+hx(base,5)+"H to "+hx((base+0xFFFF)&0xFFFFF,5)+"H (64 KB).";};$("#sg").oninput=$("#of").oninput=f;f()}],
["Flag lab",()=>`<div class="card"><h3>See flags change after an 8-bit operation</h3><div class="row"><label>A (hex)<input id="fa" value="7F" maxlength="2"></label><label>Operation<select id="fo"><option>ADD</option><option>SUB</option></select></label><label>B (hex)<input id="fb" value="01" maxlength="2"></label></div><div class="sub">Result</div><div class="out" id="fr"></div><div class="chips" id="fc"></div><p id="fe" style="color:var(--mu);margin-top:12px"></p></div>`,()=>{const f=()=>{const a=parseInt($("#fa").value,16)||0,b=parseInt($("#fb").value,16)||0,add=$("#fo").value==="ADD",r=add?a+b:a-b,x=r&255;const n=x.toString(2).split("1").length-1;const v={CF:add?r>255:a<b,PF:n%2==0,AF:add?((a&15)+(b&15))>15:(a&15)<(b&15),ZF:x==0,SF:!!(x&128),OF:add?!!((a^x)&(b^x)&128):!!((a^b)&(a^x)&128)};$("#fr").textContent=hx(x,2)+"H";$("#fc").innerHTML=Object.entries(v).map(([k,on])=>`<div class="chip ${on?"on":""}">${k}<b>${+on}</b></div>`).join("");const set=Object.keys(v).filter(k=>v[k]);$("#fe").textContent=set.length?"Set: "+set.join(", ")+". Result has "+n+" one-bits"+(v.PF?" (even → PF=1).":" (odd → PF=0)."):"No flags set."};$("#fa").oninput=$("#fb").oninput=$("#fo").onchange=f;f()}],
["Queue",()=>`<div class="card"><h3>Be the BIU and the EU</h3><p>The queue holds up to 6 bytes. Fetch while the EU is busy; execute when the EU is ready.</p><div class="qs" id="qs"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="qf">BIU: fetch byte</button><button class="btn g" id="qe">EU: execute</button><button class="btn g" id="qa">Auto-run</button></div><p id="ql" style="margin-top:12px;color:var(--mu)" aria-live="polite">Queue is empty.</p></div>`,()=>{let q=[],n=1,t=null;const d=m=>{$("#qs").innerHTML=Array.from({length:6},(_,i)=>`<span class="${q[i]?"f":""}">${q[i]?"B"+q[i]:""}</span>`).join("");if(m)$("#ql").textContent=m};const fe=()=>q.length<6?(q.push(n++),d("BIU fetched byte "+(n-1)+". Queue: "+q.length+"/6.")):d("Queue full. The BIU must wait."),ex=()=>q.length?(d("EU executed byte "+q.shift()+". Queue: "+q.length+"/6.")):d("Queue empty. The EU must wait for the BIU.");$("#qf").onclick=fe;$("#qe").onclick=ex;$("#qa").onclick=()=>{if(t){clearInterval(t);t=null;$("#qa").textContent="Auto-run"}else{$("#qa").textContent="Stop";t=setInterval(()=>{if(!$("#qa").isConnected){clearInterval(t);return}fe();if(Math.random()<.5)ex()},700)}};d()}],
["Register cards",()=>`<div class="card"><h3>Which job does this register do?</h3><button class="flip" id="fl" aria-label="Flip card"><div class="fi"><div class="f"><span class="a" id="fa2"></span></div><div class="b"><span id="fb2"></span></div></div></button><div class="nav2"><button class="btn g" id="fp">Previous</button><span class="m sub" id="fn"></span><button class="btn" id="fx">Next</button></div></div>`,()=>{let i=0;const d=()=>{$("#fl").classList.remove("o");$("#fa2").textContent=R[i][0];$("#fb2").textContent=R[i][1];$("#fn").textContent=i+1+" / "+R.length};$("#fl").onclick=()=>$("#fl").classList.toggle("o");$("#fp").onclick=()=>{i=(i+R.length-1)%R.length;d()};$("#fx").onclick=()=>{i=(i+1)%R.length;d()};d()}]];
