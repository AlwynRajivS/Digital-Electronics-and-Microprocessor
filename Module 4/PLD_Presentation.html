.k5 .km td{width:64px;height:54px;font-size:1.2rem}.k5 .km th{font-size:.8rem}#fsb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:10px;z-index:20;width:40px;height:40px;padding:0;font-size:22px;line-height:1;border-radius:10px;background:color-mix(in srgb,var(--card2) 85%,transparent);backdrop-filter:blur(6px)}#fsb:hover{border-color:var(--ac);box-shadow:0 0 14px var(--glow)}header{padding-left:60px}.sv .pol{fill:var(--card2);stroke:var(--tx);stroke-width:1.4}.sv .pol.on{fill:var(--ac)}</style></head><body><div class="orb o1"></div><div class="orb o2"></div>

<script>
const $=s=>document.querySelector(s);
const bul=(a,u)=>`<ul class="bl">${a.slice(0,u+1).map((x,i)=>`<li class="${i===u?'cur':''}">${x}</li>`).join('')}</ul>`;
const tbl=(h,rows,cur)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr class="${i===cur?'cur':''}">${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;

/* ---- helpers and problem bank ---- */
const rg=n=>[...Array(n).keys()],bin=(v,n)=>v.toString(2).padStart(n,'0'),sb=n=>String(n).split('').map(d=>'₀₁₂₃₄₅₆₇₈₉'[d]).join('');
const cvr=(c,m,n)=>{const b=bin(m,n);return [...c].every((ch,i)=>ch==='-'||ch===b[i])};
const nm=(sp,i)=>i<sp.n?sp.vars[i]:sp.fb[i-sp.n].name;
const ct=(c,sp)=>[...c].map((ch,i)=>ch==='1'?nm(sp,i):ch==='0'?nm(sp,i)+'′':'').join('')||'1';
const sop=(cs,sp)=>cs.length?cs.map(c=>ct(c,sp)).join(' + '):'0';
const bitsOf=(m,n)=>rg(n).map(i=>(m>>(n-1-i))&1);
const V3=['A','B','C'],V4=['A','B','C','D'],VB=['B₃','B₂','B₁','B₀'],DC=[10,11,12,13,14,15],FA=['A','B','Cᵢ'],GV=['B₂','B₁','B₀'];
const O=(n,on,use,inv)=>({n,on,use,inv:inv||0});
const cG=['1-0-','11-0','-100'],cL=['0-1-','00-1','-011'],cE=['0000','0101','1010','1111'],cmpV=['A₁','A₀','B₁','B₀'];
const cOn=cs=>rg(16).filter(m=>cs.some(c=>cvr(c,m,4)));
const gray=[O('G₂',[4,5,6,7]),O('G₁',[2,3,4,5]),O('G₀',[1,2,5,6])],fa=[O('S',[1,2,4,7]),O('Cₒ',[3,5,6,7])],xs3=[O('E₃',[5,6,7,8,9]),O('E₂',[1,2,3,4,9]),O('E₁',[0,3,4,7,8]),O('E₀',[0,2,4,6,8])];
const xrows=['1---','-1-1','-11-','-0-1','-01-','-100','--00','--11','---0'];
const PB=[
{ty:'PROM',id:'q4',src:'Problem 4',title:'Two functions of three variables',n:3,vars:V3,stmt:'Implement F₁ = AB′C′ + AB′C + ABC and F₂ = A′BC + AB′C + ABC using a PROM.',outs:[O('F₁',[4,5,7]),O('F₂',[3,5,7])]},
{ty:'PROM',id:'fa',src:'Extra 1',title:'Full adder',n:3,vars:FA,stmt:'Implement a full adder with a PROM: S = Σ(1,2,4,7) and Cₒ = Σ(3,5,6,7).',outs:fa},
{ty:'PROM',id:'pg',src:'Extra 2',title:'Binary to Gray converter',n:3,vars:GV,stmt:'Implement the 3-bit binary to Gray converter G₂ = B₂, G₁ = B₂⊕B₁, G₀ = B₁⊕B₀ with a PROM.',outs:gray},
{ty:'PROM',id:'psq',src:'Extra 3',title:'Squares of 3-bit numbers',n:3,vars:['x₂','x₁','x₀'],stmt:'Use a PROM as a look-up table giving the 6-bit square of x (0 to 7). Y₁ is always 0 and Y₀ = x₀.',outs:[5,4,3,2,1,0].map(b=>O('Y'+sb(b),rg(8).filter(x=>((x*x)>>b)&1)))},
{ty:'PROM',id:'pxs',src:'Extra 4',title:'BCD to Excess-3 with a PROM',n:4,vars:VB,dc:DC,stmt:'Implement the BCD to Excess-3 converter with a PROM. It has 16 words, but codes 1010 to 1111 never occur.',outs:xs3},
{ty:'PLA',id:'q1',src:'Problem 1',title:'Two functions on a 3 × 4 × 2 PLA',n:3,vars:V3,stmt:'Use a PLA with 3 inputs, 4 AND terms and 2 outputs for F₁ = Σ(3,5,6,7) and F₂ = Σ(1,2,3,4).',note:'F₂ is built as F₂′ = AC + AB + A′B′C′. It shares AC and AB with F₁, so only 4 terms are needed.',rows:['1-1','11-','-11','000'],outs:[O('F₁',[3,5,6,7],[0,1,2]),O('F₂',[1,2,3,4],[0,1,3],1)]},
{ty:'PLA',id:'q3',src:'Problem 3',title:'Functions given as expressions',n:3,vars:V3,stmt:'Implement F₁ = AB′ + AC + A′BC′ and F₂ = (AC + BC)′ using a PLA with 3 inputs, 4 product terms and 2 outputs.',rows:['10-','1-1','010','-11'],outs:[O('F₁',[2,4,5,7],[0,1,2]),O('F₂',[0,1,2,4,6],[1,3],1)]},
{ty:'PLA',id:'q9',src:'Problem 9',title:'Draw a PLA circuit',n:3,vars:V3,stmt:'Draw a PLA circuit for F₁ = A′B + AC′ + A′BC′ and F₂ = (AC + AB + BC)′.',note:'The worksheet keeps A′BC′ although A′B already covers it (6 terms). With the best polarity choice only 4 terms are needed.',rows:['01-','1-0','010','1-1','11-','-11'],outs:[O('F₁',[2,3,4,6],[0,1,2]),O('F₂',[0,1,2,4],[3,4,5],1)]},
{ty:'PLA',id:'q5',src:'Problem 5',title:'Five-variable functions (5 × 8 × 4)',n:5,vars:['a','b','c','d','e'],stmt:'Implement Z₁ = ab′d′e + a′b′c′d′e′ + bc + de, Z₂ = a′c′e, Z₃ = bc + de + c′d′e′ + bd and Z₄ = a′c′e + ce using a 5 × 8 × 4 PLA.',rows:['10-01','00000','-11--','---11','0-0-1','--000','-1-1-','--1-1'],outs:[O('Z₁',0,[0,1,2,3]),O('Z₂',0,[4]),O('Z₃',0,[2,3,5,6]),O('Z₄',0,[4,7])]},
{ty:'PLA',id:'q7',src:'Problem 7',title:'BCD to Excess-3 converter',n:4,vars:VB,dc:DC,stmt:'Design a BCD to Excess-3 converter using a PLA. Codes 1010 to 1111 never occur (don’t-cares).',rows:xrows,outs:[O('E₃',xs3[0].on,[0,1,2]),O('E₂',xs3[1].on,[3,4,5]),O('E₁',xs3[2].on,[6,7]),O('E₀',xs3[3].on,[8])]},
{ty:'PLA',id:'lm',src:'Extra 1',title:'When the complement form wins',n:3,vars:V3,stmt:'Implement F₁ = Σ(0,1,2,4) and F₂ = Σ(0,5,6,7) with a 3-input, 4-term, 2-output PLA.',note:'F₁ is built as F₁′ = AB + AC + BC (XOR = 1) and shares AB and AC with F₂.',rows:['11-','1-1','-11','000'],outs:[O('F₁',[0,1,2,4],[0,1,2],1),O('F₂',[0,5,6,7],[0,1,3])]},
{ty:'PLA',id:'lfa',src:'Extra 2',title:'Full adder on a 3 × 7 × 2 PLA',n:3,vars:FA,stmt:'Implement a full adder with a PLA: S = Σ(1,2,4,7) and Cₒ = Σ(3,5,6,7).',rows:['001','010','100','111','11-','-11','1-1'],outs:[O('S',[1,2,4,7],[0,1,2,3]),O('Cₒ',[3,5,6,7],[4,5,6])]},
{ty:'PLA',id:'lg',src:'Extra 3',title:'Binary to Gray converter',n:3,vars:GV,stmt:'Implement G₂ = Σ(4,5,6,7), G₁ = Σ(2,3,4,5) and G₀ = Σ(1,2,5,6) with a PLA.',rows:['1--','01-','10-','-01','-10'],outs:[O('G₂',[4,5,6,7],[0]),O('G₁',[2,3,4,5],[1,2]),O('G₀',[1,2,5,6],[3,4])]},
{ty:'PLA',id:'lc',src:'Extra 4',title:'2-bit magnitude comparator',n:4,vars:cmpV,stmt:'Design a comparator for A = A₁A₀ and B = B₁B₀ with outputs G (A > B), E (A = B) and L (A < B) using a PLA.',rows:[...cG,...cE,...cL],outs:[O('G',cOn(cG),[0,1,2]),O('E',cOn(cE),[3,4,5,6]),O('L',cOn(cL),[7,8,9])]},
{ty:'PAL',id:'q2',src:'Problem 2',title:'Four functions with feedback',n:4,vars:V4,t:3,fb:[{name:'W',from:0}],stmt:'Design with a PAL: W = Σ(2,12,13), X = Σ(7,8,9,10,11,12,13,14,15), Y = Σ(0,2,3,4,5,6,7,8,10,11,15) and Z = Σ(1,2,8,12,13).',fbNote:'Z needs four terms, but ABC′ + A′B′CD′ is exactly W. Feeding W back gives Z = W + AC′D′ + A′B′C′D with three terms.',rows:['110--','0010-',null,'1----','-111-',null,'01---','--11-','-0-0-','----1','1-00-','0001-'],outs:[O('W',[2,12,13]),O('X',[7,8,9,10,11,12,13,14,15]),O('Y',[0,2,3,4,5,6,7,8,10,11,15]),O('Z',[1,2,8,12,13])]},
{ty:'PAL',id:'q6',src:'Problem 6',title:'PAL with the shared term W',n:4,vars:V4,t:3,fb:[{name:'W',from:0}],stmt:'Implement W = Σ(0,2,6,7,8,9,12,13), X = Σ(0,2,6,7,8,9,12,13,14), Y = Σ(2,3,8,9,10,12,13) and Z = Σ(1,3,4,6,9,12,14) using a PAL.',fbNote:'X = AC′ + A′B′D′ + A′BC + BCD′ needs four terms, but its first three are W. Feeding W back gives X = W + BCD′.',rows:['1-0--','00-0-','011--','----1','-110-',null,'1-0--','001--','10-0-','-1-0-','00-1-','-001-'],outs:[O('W',[0,2,6,7,8,9,12,13]),O('X',[0,2,6,7,8,9,12,13,14]),O('Y',[2,3,8,9,10,12,13]),O('Z',[1,3,4,6,9,12,14])]},

["Which two arrays make up a basic PLD?",["A RAM array and a ROM array","An AND array followed by an OR array","Two OR arrays","An adder array and a latch array"],1,"Any Boolean function is a sum of products: AND plane then OR plane."],
["In a PROM, which array is fixed?",["The AND array","The OR array","Both arrays","Neither"],0,"The fixed AND array is a decoder generating all minterms."],
["In a PAL, which array is programmable?",["Only the OR array","Only the AND array","Both arrays","Neither array"],1,"A PAL has a programmable AND array and a fixed OR array."],
["Which device has both arrays programmable?",["PROM","PLA","PAL","None of them"],1,"Only the PLA has two programmable arrays."],

["Why do PLA outputs end in an XOR gate?",["To add the output to the input","To select the true or complement form","To store the output","To generate product terms"],1,"XOR input 0 gives F, 1 gives F′."],
["In Problem 1, why is F₂ built as F₂′ = AC + AB + A′B′C′?",["It shares AC and AB with F₁, so only 4 product terms are needed","F₂ cannot be simplified","The PLA cannot produce true outputs","F₂′ has fewer inputs"],0,"4 distinct terms instead of 6."],
["The simplified form of F₁ = Σ(3, 5, 6, 7) is:",["AB + BC + AC","A + B + C","ABC","A′B′C′"],0,"The majority function."],
["How many product terms can a PAL output have in Problems 2, 6, 8 and 10?",["2","3","4","12"],1,"Each output has 3 AND gates."],
["In Problem 2, why is W fed back to the PAL input?",["Because W is an input signal","To reduce Z to three terms (Z = W + AC′D′ + A′B′C′D)","To invert W","To remove the OR array"],1,"Two of Z’s four terms make up W."],
["A PAL has 4 outputs with 3 terms each. How many AND gates?",["3","4","7","12"],3,"4 × 3 = 12."],
["Problem 4: F₁ = Σ(4, 5, 7). How many OR-array crosspoints are programmed for F₁?",["1","3","4","8"],1,"One × per minterm: 4, 5 and 7."],
["Problem 4: how many OR-array crosspoints are programmed for F₁ and F₂ together?",["3","6","8","16"],1,"3 + 3 = 6 of 16."],
["In the BCD to Excess-3 converter, E₀ equals:",["B₀′","B₀","B₁ + B₀","B₃"],0,"The LSB of Excess-3 is the complement of the BCD LSB."],

{t:'',n:1,f:()=>`<div class="hero"><div class="kick">DIGITAL SYSTEM DESIGN</div><div class="big2">Programmable Logic Devices</div><p class="sub">PROM, PLA and PAL: design with AND\u2013OR arrays</p><div class="tags"><span>PROM</span><span>PLA</span><span>PAL</span></div><div class="pres"><div class="av">SA</div><div><div class="by">Presented by</div><div class="pnm">Mr. S. Alwyn Rajiv</div><div class="prole">Assistant Professor, Department of ECE</div><div class="pcol">Kamaraj College of Engineering and Technology</div></div></div></div>`},
{t:'What is a PLD?',n:4,f:u=>bul(['A <b>programmable logic device</b> is an IC whose logic function is <b>defined by the user</b> after it is manufactured.','Every Boolean function is a <b>sum of products</b>, so a PLD is an <b>AND array</b> followed by an <b>OR array</b>.','At each crossing there is a link. A <b>programmed link (\u00d7)</b> connects the lines; a removed link leaves them separate.','One chip replaces many gate ICs: <b>smaller, cheaper to change, quick to prototype</b>.'],u)},
{t:'PROM, PLA and PAL compared',n:CMP.length,f:u=>tbl(['','PROM','PLA','PAL'],CMP.slice(0,u+1),u)},
{t:'PLD Design Procedure',n:procs.length,f:u=>`<div>${procs.map((p,i)=>`<div class="pi ${i<u?'done':i===u?'now':''}" style="${i>u?'opacity:.25':''}"><div class="pn">${i<u?'\u2713':i+1}</div><div><b>${p[0]}</b><div class="mu">${p[1]}</div></div></div>`).join('')}</div>`},
{t:'PROM: Programmable Read-Only Memory',n:4,f:u=>bul(['<b>Fixed AND array</b> (a decoder producing all 2\u207f minterms) and a <b>programmable OR array</b>.','The inputs act as the <b>address</b>; the output bits are the <b>stored word</b>. Size = <b>2\u207f words \u00d7 m bits</b>.','Any function of n variables fits, with <b>no simplification</b>.','Drawback: rows <b>double with every extra input</b>, so only few inputs are practical.'],u)},
{t:'PLA: Programmable Logic Array',n:4,f:u=>bul(['<b>Both arrays are programmable</b>: only the needed product terms are built.','Outputs can <b>share</b> product terms. Size is written <b>n \u00d7 p \u00d7 m</b>.','An <b>XOR gate</b> on each output selects the true form F (0) or the complement F\u2032 (1).','Implement <b>F or F\u2032</b>, whichever gives the fewest distinct terms overall.'],u)},
{t:'PAL: Programmable Array Logic',n:4,f:u=>bul(['<b>Programmable AND array</b> and a <b>fixed OR array</b>.','Each output owns a fixed number of AND gates (e.g. 3); terms <b>cannot be shared</b>.','If a function needs more terms, <b>feed another output back</b> as an input (e.g. Z = W + AC\u2032D\u2032 + A\u2032B\u2032C\u2032D).','Simpler, cheaper and faster than a PLA.'],u)},
