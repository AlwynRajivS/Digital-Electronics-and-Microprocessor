<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">

<style>
:root{--bg:#EAF1FB;--card:#FFFFFF;--card2:#EAF1FD;--tx:#0F2447;--mu:#4B5F7E;--ac:#2563EB;--ac2:#1E40AF;--ok:#059669;--clk:#D97706;--rst:#DC2626;--dat:#2563EB;--bd:#BFD0EA;--glow:rgba(37,99,235,.22);--grad:linear-gradient(135deg,#2563EB,#06B6D4);--seg:#E11D48;--off:#E6EBF3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme=dark]{--bg:#0B1220;--card:#121C33;--card2:#1B2947;--tx:#EAF1FF;--mu:#9DB0D3;--ac:#60A5FA;--ac2:#BFDBFE;--ok:#34D399;--clk:#FBBF24;--rst:#F87171;--dat:#60A5FA;--bd:#2B3F6A;--glow:rgba(96,165,250,.3);--seg:#FB7185;--off:#24324F;color-scheme:dark}
*{box-sizing:border-box}html{font-size:26px}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Times New Roman",Times,serif;line-height:1.35;display:flex;flex-direction:column;overflow:hidden}
button,select,input{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--bd);border-radius:10px;padding:4px 14px;cursor:pointer}input{cursor:text;width:4.2rem;text-align:center}button:disabled{opacity:.4;cursor:not-allowed}button:hover:not(:disabled){border-color:var(--ac);box-shadow:0 0 12px var(--glow)}
header,#wrap,footer,#bar{position:relative;z-index:1}
@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}@keyframes pulse{50%{box-shadow:0 0 28px var(--glow)}}@keyframes sweep{from{transform:scaleX(0)}}@keyframes bob{50%{transform:translateY(-7px)}}@keyframes flash{from{background:var(--clk);color:#fff}}
header,footer{display:flex;gap:10px;align-items:center;padding:7px 16px;font-size:16px;background:color-mix(in srgb,var(--card) 90%,transparent);flex-wrap:wrap}header{border-bottom:1px solid var(--bd);padding-left:60px}footer{border-top:1px solid var(--bd)}header b{flex:1;font-size:18px}.mu{color:var(--mu)}
#fsb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:10px;z-index:20;width:40px;height:40px;padding:0;font-size:22px;line-height:1;border-radius:10px}
#bar{height:6px;background:var(--card2)}#fill{height:100%;background:var(--grad);width:0;transition:.4s}
#nx{background:var(--grad);color:#fff;border:none;font-weight:700;font-size:20px;padding:8px 34px;animation:pulse 2.4s infinite}
body.clean header,body.clean #bar{display:none}body.clean footer>*:not(#nx):not(#pv){display:none}
#wrap{flex:1;overflow:hidden}
#slide{position:absolute;width:1600px;height:900px;transform-origin:0 0;border-radius:24px;border:2px solid var(--bd);overflow:hidden;background:var(--card);box-shadow:0 10px 60px var(--glow)}
#slide::before{content:'';position:absolute;left:0;right:0;top:0;height:9px;background:var(--grad);z-index:2}
#stage{position:absolute;inset:0 0 46px 0;padding:34px 56px 0;overflow:hidden}
.sf{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 56px;font-size:18px;color:var(--mu);border-top:1px solid var(--bd);background:var(--card2)}
#stage.enter #sc>*{animation:enter .6s both}
h1{position:relative;display:inline-block;font-size:2.4rem;margin:2px 0 20px;color:var(--ac2)}h1::after{content:'';position:absolute;left:0;bottom:-6px;height:5px;width:100%;background:var(--grad);border-radius:5px;transform-origin:left;animation:sweep .9s .2s both}
h2{margin:2px 0 10px;color:var(--ac2);font-size:1.6rem}h3{margin:8px 0 6px;color:var(--mu);font-size:.95rem;text-transform:uppercase;letter-spacing:.08em}
.bl{list-style:none;padding:0;margin:0;max-width:1400px}.bl li{font-size:1.7rem;margin:16px 0;padding:8px 20px;border-left:6px solid var(--bd);opacity:.7;border-radius:0 12px 12px 0}.bl li.cur{opacity:1;border-color:var(--ac);background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 14%,transparent),transparent);animation:pop .5s both}
table{border-collapse:collapse;font-size:1.15rem;margin:8px 0;width:100%}th,td{border:1px solid var(--bd);padding:.2em .6em;text-align:center}th{background:var(--card2)}td:first-child{font-weight:700;color:var(--ac2)}tr.cur td{background:color-mix(in srgb,var(--ok) 22%,transparent);font-weight:700;animation:flash 1s}tr[data-d]{cursor:pointer}tr.sel td{background:color-mix(in srgb,var(--ac) 18%,transparent)}.sm table{font-size:.95rem}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:8px 0}
.det{background:var(--card2);border:1px solid var(--bd);border-radius:18px;padding:12px 24px}.det p{font-size:1.25rem;margin:8px 0}
.sv{width:100%;height:auto;background:var(--card);border-radius:14px;border:1px solid var(--bd)}.sv text{font-family:"Times New Roman",serif;fill:var(--tx)}.sv .b1{font-size:24px;font-weight:700}.sv .b2{font-size:19px;fill:var(--mu)}.sv .bx{fill:var(--card2);stroke:var(--ac);stroke-width:3}.sv g.cur .bx{stroke:var(--clk);stroke-width:6}.sv .ax{stroke:var(--mu);stroke-width:2}.sv .mono{font-size:15px}
.bits i{display:inline-grid;width:44px;height:44px;border-radius:50%;place-items:center;border:3px solid var(--bd);margin:0 4px;font-weight:700;font-style:normal;font-size:1.1rem;background:var(--card2)}.bits i.on{background:var(--dat);color:#fff;border-color:var(--dat)}
.lamp{display:inline-block;padding:3px 14px;border-radius:999px;border:2px solid var(--bd);font-size:1rem;color:var(--mu);margin:3px}.lamp.on{background:var(--clk);color:#fff;border-color:var(--clk)}.lamp.on.g{background:var(--ok);border-color:var(--ok)}.lamp.on.r{background:var(--rst);border-color:var(--rst)}
.bigd{font-size:3.4rem;font-weight:700;color:var(--ac2);line-height:1}.fl{min-height:2.4rem;font-size:1.2rem;color:var(--clk);font-weight:700;margin:6px 0}
.cb{background:var(--card2);border:2px solid var(--bd);border-radius:16px;padding:8px 16px;text-align:center}.cb h3{margin:2px}.arrow{font-size:2.2rem;color:var(--ok)}
.six{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0}.sc{background:var(--card2);border:2px solid var(--bd);border-radius:14px;padding:6px;text-align:center}.sc b{font-size:1.2rem;color:var(--ac2)}.sc .m{display:block;font-size:.8rem;color:var(--mu)}.sc .cnt{font-size:2rem;font-weight:700}.sc .bits i{width:30px;height:30px;font-size:.85rem;margin:2px}.sc .sg{font-size:1rem;color:var(--seg);letter-spacing:.1em;min-height:1.3rem}.sc svg{width:60%;display:block;margin:2px auto}
.simdisp{background:#101826;border-radius:18px;padding:14px 24px;--off:#2A3350}.simdisp svg{width:100%;max-width:760px;display:block;margin:auto;background:none;border:none}
.hero{text-align:center;padding-top:10px}.kick{display:inline-block;letter-spacing:.3em;font-size:1.1rem;color:var(--mu);border:1px solid var(--bd);padding:6px 26px;border-radius:999px;background:var(--card2)}
.big2{font-size:3.7rem;font-weight:700;line-height:1.1;margin:14px 0 4px;color:var(--ac2)}.sub{font-size:1.6rem;margin:0 0 8px;color:var(--mu)}
.pres{display:inline-flex;gap:26px;align-items:center;text-align:left;margin-top:14px;padding:16px 40px 16px 24px;border-radius:26px;background:var(--card);border:2px solid var(--ac);box-shadow:0 0 30px var(--glow);animation:bob 4s ease-in-out infinite}
.av{width:96px;height:96px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:2.3rem;font-weight:700;color:#fff}.by{font-size:1rem;color:var(--mu);letter-spacing:.2em;text-transform:uppercase}.pnm{font-size:2.1rem;font-weight:700}.prole{font-size:1.3rem}.pcol{font-size:1.3rem;color:var(--ac2);font-weight:700}
.chip2{font-size:1.15rem;padding:6px 20px}.chip2.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:8px 18px;border-radius:14px;background:var(--card);border:2px solid var(--bd);font-size:1.25rem}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card));opacity:1}.opt.no{border-color:var(--rst);background:color-mix(in srgb,var(--rst) 14%,var(--card));opacity:1}
.fb{padding:8px 16px;border-radius:12px;margin:8px 0;font-size:1.15rem}.fb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card))}.fb.no{background:color-mix(in srgb,var(--rst) 14%,var(--card))}
.go{background:var(--grad);color:#fff;font-size:1.3rem;padding:8px 34px;border:none}.card3{background:var(--card2);border:1px solid var(--bd);border-radius:16px;padding:14px 20px}.card3 b{color:var(--ac2);font-size:1.3rem}.card3 p{margin:4px 0;font-size:1.1rem}
.eq{font-size:1.5rem;margin:10px 0;padding:6px 14px;background:var(--card2);border-left:6px solid var(--ac);border-radius:0 10px 10px 0;animation:pop .45s both}.eq small{color:var(--mu);font-size:1rem}
.leg span{display:inline-block;margin-right:20px;font-size:1.05rem}.leg i{display:inline-block;width:30px;height:6px;border-radius:3px;margin-right:6px;vertical-align:middle}
.km{width:auto;border-collapse:separate;border-spacing:4px}.km td{position:relative;width:96px;height:66px;font:700 1.5rem 'Times New Roman',serif;border:none;background:var(--card2);border-radius:8px}.km td small{position:absolute;top:2px;left:6px;font-size:.6rem;color:var(--mu);font-weight:400}.km th{border:none;background:none;color:var(--mu);font-size:1rem}.kls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.kt{border:3px solid;border-radius:999px;padding:2px 12px;font-weight:700;font-size:1.1rem}</style></head><body>
<button id="fsb" type="button" aria-label="Toggle full screen" title="Full screen (F)">⛶</button>
<header><b>⏱ Real-Time Clock Design · Counters, Decoders and 7-Segment Displays</b><select id="jump" aria-label="Jump to slide"></select></header>
<main id="wrap"><div id="slide"><div id="stage"></div><div class="sf"><span>Kamaraj College of Engineering and Technology · Department of ECE</span><span id="sn"></span></div></div></main><div id="bar"><div id="fill"></div></div>
<footer><button id="nx">Next ▶</button><button id="pv">◀ Previous</button><button id="all">Reveal all</button><span class="mu" id="prog"></span><span style="flex:1"></span><span class="mu">→ / Space next · ← back · F full · T theme · H clean view</span><button id="th">Theme</button><button id="fs">Fullscreen</button></footer>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),b4=n=>n.toString(2).padStart(4,'0');
const SEG=['abcdef','bc','abdeg','abcdg','bcfg','acdfg','acdefg','abc','abcdefg','abcdfg'],SG=[['a',10,2,40,8],['b',50,10,8,36],['c',50,54,8,36],['d',10,90,40,8],['e',2,54,8,36],['f',2,10,8,36],['g',10,46,40,8]];
const bul=(a,u)=>`<ul class="bl">${a.slice(0,u+1).map((x,i)=>`<li class="${i===u?'cur':''}">${x}</li>`).join('')}</ul>`;
const tbl=(h,rows,cur)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map((r,i)=>`<tr class="${i===cur?'cur':''}">${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const bits=(v,n=4)=>`<span class="bits">${v.toString(2).padStart(n,'0').split('').map(b=>`<i class="${b==='1'?'on':''}">${b}</i>`).join('')}</span>`;
const seg=(d,x,y,sc)=>{const on=d==null?'':SEG[d];return`<g transform="translate(${x},${y}) scale(${sc})">${SG.map(([k,a,b,w,h])=>`<rect x="${a}" y="${b}" width="${w}" height="${h}" rx="3" style="fill:var(${on.includes(k)?'--seg':'--off'})"/>`).join('')}</g>`};
const dsv=d=>`<svg viewBox="0 0 60 100" style="background:none;border:none">${seg(d,0,0,1)}</svg>`;
function clk(dg,tag){const X=[0,74,170,244,340,414];return`<svg class="sv" viewBox="0 0 ${tag?540:474} 100" style="background:none;border:none">${dg.map((d,i)=>seg(d,X[i],0,1)).join('')}${[152,322].map(x=>`<circle cx="${x}" cy="32" r="5" style="fill:var(--seg)"/><circle cx="${x}" cy="68" r="5" style="fill:var(--seg)"/>`).join('')}${tag?`<text x="476" y="70" style="fill:#fff;font-size:34px;font-weight:700">${tag}</text>`:''}</svg>`}
/* clock model */
function tick(t){const e={su:t.s%10===9,st:t.s===59,mu:t.s===59&&t.m%10===9,mt:t.s===59&&t.m===59,hu:t.s===59&&t.m===59&&t.h%10===9,day:t.s===59&&t.m===59&&t.h===23};t.s++;if(t.s>59){t.s=0;t.m++;if(t.m>59){t.m=0;t.h++;if(t.h>23)t.h=0}}return e}
const nextT=(h,m,s)=>{const t={h,m,s};tick(t);return t},dig6=t=>[t.h/10|0,t.h%10,t.m/10|0,t.m%10,t.s/10|0,t.s%10],tstr=t=>`${pad(t.h)}:${pad(t.m)}:${pad(t.s)}`;
const defs=()=>`<defs>${[['c','--clk'],['g','--ok'],['r','--rst'],['b','--dat']].map(([i,c])=>`<marker id="m${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(${c})"/></marker>`).join('')}</defs>`;
const LEG=`<div class="leg"><span><i style="background:var(--clk)"></i>clock</span><span><i style="background:var(--dat)"></i>data (BCD / segments)</span><span><i style="background:var(--ok)"></i>carry</span><span><i style="background:var(--rst)"></i>reset</span></div>`;
let TT=[];
/* ---- Step 1 block diagram ---- */
const BCAP=['A crystal oscillator and divider produce a precise <b>1 Hz</b> clock: one pulse = one second.','The <b>seconds counter</b> (MOD-60) counts the pulses 00 → 59.','Its rollover (59 → 00) is a <b>minute pulse</b> that clocks the minutes counter (MOD-60).','Minutes rollover gives the <b>hour pulse</b> for the hours counter (MOD-24, 00 → 23).','Six BCD digits feed six <b>BCD-to-7-segment decoders</b>.','The decoders drive six <b>7-segment displays</b> showing HH:MM:SS.'];
function blocks(u){const B=[['Clock generator','1 Hz'],['Seconds counter','MOD-60'],['Minutes counter','MOD-60'],['Hours counter','MOD-24'],['BCD → 7-seg','decoders × 6'],['Displays','HH : MM : SS']],AR=[['1 Hz clock','c','--clk'],['minute pulse','g','--ok'],['hour pulse','g','--ok'],['BCD data','b','--dat'],['segments a–g','b','--dat']];
 let o=`<svg class="sv" viewBox="0 0 1420 200">${defs()}`;B.forEach((b,i)=>{if(i>u)return;const x=10+i*235;o+=`<g class="${i===u?'cur':''}"><rect class="bx" x="${x}" y="30" width="190" height="110" rx="14"/><text x="${x+95}" y="78" text-anchor="middle" class="b1">${b[0]}</text><text x="${x+95}" y="112" text-anchor="middle" class="b2">${b[1]}</text></g>`;if(i){const a=AR[i-1];o+=`<path d="M${x-45} 85H${x-3}" stroke="var(${a[2]})" stroke-width="5" fill="none" marker-end="url(#m${a[1]})"/><text x="${x-22}" y="175" text-anchor="middle" class="b2" style="fill:var(${a[2]})">${a[0]}</text>`}});return o+'</svg>'}
/* ---- Step 2 clock pulse ---- */
const W2={f:1,n:0};
function wave(){const f=W2.f,T=1/f;let d='M40 110',x=40;const w=150;for(let i=0;i<5;i++){d+=`V30H${x+w/2}V110H${x+w}`;x+=w}return`<svg class="sv" viewBox="0 0 820 190">${defs()}<path d="${d}" fill="none" stroke="var(--clk)" stroke-width="5"/><path d="M40 150H190" stroke="var(--ac)" stroke-width="3" marker-end="url(#mb)"/><path d="M190 150H40" stroke="var(--ac)" stroke-width="3" marker-end="url(#mb)"/><text x="115" y="178" text-anchor="middle" class="b2">T = 1/f = ${T} s</text><text x="30" y="26" class="b2">rising edge = 1 count</text></svg>`}
/* ---- Step 3 counters ---- */
const C3={mod:10,v:0,h:[],msg:''};
function c3pulse(){const c=C3,o=c.v;c.v=(c.v+1)%c.mod;c.msg=c.v===0?`Rollover ${o} → 0: reset condition (count ${c.mod}) detected, carry out generated`:'';c.h.push(`${o} → ${c.v}`);if(c.h.length>7)c.h.shift()}
/* ---- Steps 4-6 cascades ---- */
const CS={sec:{t:0,u:0,cu:0,ct:0,msg:''},min:{t:0,u:0,cu:0,ct:0,msg:''},hr:{t:0,u:0,cu:0,ct:0,msg:''}};
function pulse(k){const c=CS[k];c.cu=c.ct=0;c.msg='';c.u++;if(k==='hr'&&c.t===2&&c.u===4){c.u=0;c.t=0;c.cu=c.ct=1;c.msg='24 detected → both counters cleared: 23 → 00 (day rollover)'}else{if(c.u===10){c.u=0;c.t++;c.cu=1;c.msg='Units rolled 9 → 0: its carry increments the tens counter'}if(k!=='hr'&&c.t===6){c.t=0;c.ct=1;c.msg='Tens rolled 5 → 0 (59 → 00): carry out to the next counter'}}}
function casc(k){const c=CS[k],cf={sec:['Seconds','Clock 1 Hz ▶',6,'ST','SU',59],min:['Minutes','Minute pulse ▶',6,'MT','MU',59],hr:['Hours','Hour pulse ▶',3,'HT','HU',23]}[k],box=(nm,v,m,cr)=>`<div class="cb"><h3>${nm} · MOD-${m}</h3><div class="bigd">${v}</div>${bits(v)}<div><span class="lamp ${cr?'on g':''}">carry</span></div></div>`;
 return`<div class="row" style="flex-wrap:nowrap;align-items:stretch">${box(cf[4],c.u,10,c.cu)}<span class="arrow">➜</span>${box(cf[3],c.t,cf[2],c.ct)}</div><div class="bigd" style="margin:8px 0;font-size:2.6rem">${cf[0]} = ${pad(c.t*10+c.u)}</div><div class="fl">${c.msg}</div><div class="row"><button class="go" data-cs="${k}:p">${cf[1]}</button><button data-cs="${k}:10">+10</button><button data-cs="${k}:9">Set 09</button><button data-cs="${k}:m">Set ${cf[5]}</button><button data-cs="${k}:0">Reset</button></div>`}
const casSlide=(k,txt)=>({t:{sec:'Step 4 · Seconds Counter (MOD-60)',min:'Step 5 · Minutes Counter (MOD-60)',hr:'Step 6 · Hours Counter (MOD-24)'}[k],n:txt.length,f:u=>`<div class="cols"><div>${bul(txt,u)}</div><div>${casc(k)}</div></div>`});
/* ---- Step 7 BCD / decoder / six displays ---- */
const SD={d:0,ca:0},T7={h:12,m:34,s:56};
const DEC=u=>{const ca=SD.ca,rows=[...Array(10).keys()].map(d=>{const bb=b4(d).split('');return[d,...bb,...'abcdefg'.split('').map(k=>(SEG[d].includes(k)?1:0)^ca)]});
 return`<div class="cols"><div class="sm"><table><tr><th>Digit</th><th>D</th><th>C</th><th>B</th><th>A</th>${'abcdefg'.split('').map(k=>`<th>${k}</th>`).join('')}</tr>${rows.map(r=>`<tr data-d="${r[0]}" class="${r[0]===SD.d?'sel':''}">${r.map((x,i)=>`<td style="${i>4&&u<1?'opacity:.15':''}">${x}</td>`).join('')}</tr>`).join('')}</table><p class="mu" style="font-size:1rem;margin:2px">Click a row. Output level shown for a ${ca?'common-anode (lit = 0)':'common-cathode (lit = 1)'} display.</p></div>

const rg=n=>[...Array(n).keys()],bin=(v,n)=>v.toString(2).padStart(n,'0'),cvr=(c,m,n)=>{const b=bin(m,n);return[...c].every((ch,i)=>ch==='-'||ch===b[i])};
function primes(n,on,dc){let cur=[...new Set([...on,...dc])].map(m=>bin(m,n)),P=[];while(cur.length){const used=new Set(),nx=new Set();for(let i=0;i<cur.length;i++)for(let j=i+1;j<cur.length;j++){const a=cur[i],b=cur[j];let d=-1,ok=true;for(let k=0;k<n;k++)if(a[k]!==b[k]){if(a[k]==='-'||b[k]==='-'||d>=0){ok=false;break}d=k}if(ok&&d>=0){nx.add(a.slice(0,d)+'-'+a.slice(d+1));used.add(a);used.add(b)}}cur.forEach(c=>{if(!used.has(c))P.push(c)});cur=[...nx]}return[...new Set(P)]}
function minCover(n,on,dc=[]){if(!on.length)return[];const P=primes(n,on,dc).filter(p=>on.some(m=>cvr(p,m,n)));let sel=[];
 for(const m of on){const c=P.filter(p=>cvr(p,m,n));if(c.length===1&&!sel.includes(c[0]))sel.push(c[0])}

 if(left.length){const rest=P.filter(p=>!sel.includes(p)&&left.some(m=>cvr(p,m,n)));let best=null;const search=(k,st,ch)=>{if(best)return;if(left.every(m=>ch.some(p=>cvr(p,m,n)))){best=ch.slice();return}if(ch.length>=k)return;for(let i=st;i<rest.length;i++){ch.push(rest[i]);search(k,i+1,ch);ch.pop()}};for(let k=1;k<=rest.length&&!best;k++)search(k,0,[]);sel=sel.concat(best||rest)}

function nextOf(d,s){let r=0;for(let i=0;i<d.n;i++){const q=(s>>i)&1,g=p=>evC(d.cubes[p+i],s,d.n);let b;if(d.ff==='T')b=q^g('T');else if(d.ff==='D')b=g('D');else b=((g('J')&&!q)||(!g('K')&&q))?1:0;r|=b<<i}return r}
function ffChar(ff){const r=[];if(ff==='T')[0,1].forEach(t=>[0,1].forEach(q=>r.push([t,q,q^t])));else if(ff==='D')[0,1].forEach(x=>[0,1].forEach(q=>r.push([x,q,x])));else[0,1].forEach(j=>[0,1].forEach(k=>[0,1].forEach(q=>r.push([j,k,q,((j&&!q)||(!k&&q))?1:0]))));return tbl(ff==='JK'?['J','K','Q','Q⁺']:[ff,'Q','Q⁺'],r)}
const CDN={10:'MOD-10 (SU, MU, HU)',6:'MOD-6 (ST, MT)',3:'MOD-3 (HT: 0–2)'};
const CDS=[
{t:'Counter Design · Select Counter and Flip-Flop',n:1,f:()=>{const d=cd();return`<h3>1 · Choose the counter</h3><div class="row">${[10,6,3].map(m=>`<button class="chip2 ${CD.mod===m?'on':''}" data-cdm="${m}">${CDN[m]}</button>`).join('')}</div><h3>2 · Choose the flip-flop</h3><div class="row">${['T','D','JK'].map(f=>`<button class="chip2 ${CD.ff===f?'on':''}" data-cdf="${f}">${f} flip-flop</button>`).join('')}</div><div class="det" style="margin-top:14px"><p>Design a synchronous <b>${CDN[CD.mod]}</b> up-counter with <b>${CD.ff}</b> flip-flops.</p><p>Flip-flops needed: n = ⌈log₂ ${d.mod}⌉ = <b>${d.n}</b> · states used: ${d.mod} of ${d.M}${d.unused.length?` · unused (don’t-care): <b>${d.unused.join(', ')}</b>`:''}.</p><p class="mu">Press Next to follow the design: state table → excitation tables → K-maps → equations → verification. The same method designs every counter in the clock.</p></div>`}},
{t:'Counter Design · Step 1: Sequence and Flip-Flops',n:3,f:u=>{const d=cd();return bul([`Counting sequence (${CDN[d.mod]}):<div class="eq">${d.rows.map(r=>bin(r.s,d.n)).join(' → ')} → ${bin(0,d.n)}</div>`,`Number of flip-flops n = ⌈log₂ ${d.mod}⌉ = <b>${d.n}</b>; outputs <b>${d.nm.join(' ')}</b> using <b>${d.ff}</b> flip-flops.`,d.unused.length?`Unused states <b>${d.unused.map(s=>bin(s,d.n)).join(', ')}</b> never occur: they become <b>don’t-cares (X)</b> in the K-maps.`:'All states are used: no don’t-cares.'],u)}},
{t:'Counter Design · Step 2: State Table',get n(){return cd().rows.length},f:u=>{const d=cd();return`<div class="cols"><div>${tbl(['Present '+d.nm.join(''),'Next '+d.nm.join(''),'Decimal'],d.rows.slice(0,u+1).map(r=>[bin(r.s,d.n),bin(r.nx,d.n),r.s+' → '+r.nx]),u)}</div><div class="det"><p>Each clock pulse moves the counter to the next state; after ${d.mod-1} (${bin(d.mod-1,d.n)}) it <b>rolls over to 0</b>.</p><p class="mu">Next-state column = present state + 1 (mod ${d.mod}).</p></div></div>`}},
{t:'Counter Design · Step 3: Flip-Flop Tables',n:2,f:u=>{const d=cd();return u?`<h3>${d.ff} excitation table: what inputs give Q → Q⁺?</h3>${tbl(['Q → Q⁺',...d.pins],['00','01','10','11'].map(k=>[k[0]+' → '+k[1],...EXC[d.ff][k].map(x=>x.toUpperCase())]))}<p class="mu">X = don’t-care.</p>`:`<h3>${d.ff} characteristic equation and table</h3><div class="eq">${FFI[d.ff][0]}</div><p>${FFI[d.ff][1]}.</p>${ffChar(d.ff)}`}},
{t:'Counter Design · Step 4: Counter Excitation Table',get n(){return cd().rows.length},f:u=>{const d=cd(),r=d.rows[u];return`<div class="cols"><div class="sm">${tbl(['Present','Next',...d.keys],d.rows.slice(0,u+1).map(x=>[bin(x.s,d.n),bin(x.nx,d.n),...d.keys.map(k=>x.ex[k].toUpperCase())]),u)}</div><div class="det"><h3>Row ${u+1}: ${bin(r.s,d.n)} → ${bin(r.nx,d.n)}</h3>${rg(d.n).map(j=>{const b=d.n-1-j;return`<div class="eq" style="font-size:1.15rem">Q${b}: ${(r.s>>b)&1} → ${(r.nx>>b)&1} ⇒ ${d.pins.map(p=>p+b+' = '+r.ex[p+b].toUpperCase()).join(', ')}</div>`}).join('')}</div></div>`}},
{t:'Counter Design · Step 5: K-map Simplification',get n(){return cd().keys.length},f:u=>{const d=cd(),k=d.keys[u];return`<div class="cols">${kmap(d.nm,d.val[k],d.cubes[k],`K-map for ${k}`)}<div class="det"><p>Group adjacent 1s and X cells (sizes 1, 2, 4, 8). Variables that change inside a loop drop out.</p><h3>Expressions so far</h3>${d.keys.slice(0,u+1).map(x=>`<div class="eq" style="font-size:1.2rem">${x} = ${d.eq[x]}</div>`).join('')}</div></div>`}},
{t:'Counter Design · Step 6: Equations and Logic',n:1,f:()=>{const d=cd();return`<div class="cols"><div>${d.keys.map(k=>`<div class="eq">${k} = ${d.eq[k]}</div>`).join('')}<div class="eq" style="border-color:var(--ok)">Carry out = ${d.carry} <small>(state ${d.mod-1}: clocks the next counter)</small></div></div><div class="det"><p>Connect each flip-flop input to its AND–OR network, drive every clock pin from the <b>same clock</b> (synchronous), and feed the carry equation to the next stage.</p><p>${d.ff==='T'?'T inputs: each stage toggles only when the lower bits make its equation 1.':d.ff==='D'?'D inputs directly set the next value of each bit.':'J and K inputs set, reset, hold or toggle each bit.'}</p></div></div>`}},
{t:'Counter Design · Step 7: Verification',n:1,f:()=>{const d=cd();let ok=0;const rows=d.rows.map(r=>{const g=nextOf(d,r.s),p=g===r.nx;ok+=p;return[bin(r.s,d.n),bin(r.nx,d.n),bin(g,d.n),p?'✓':'✗']});
 const un=d.unused.map(s=>{let c=s,i=0;while(c>=d.mod&&i<8){c=nextOf(d,c);i++}return[bin(s,d.n)+' → '+bin(nextOf(d,s),d.n),c<d.mod?'self-corrects to '+bin(c,d.n):'lock-out!']});
 return`<div class="cols"><div class="sm">${tbl(['Present','Required next','From equations','OK'],rows)}</div><div class="det"><p style="font-size:1.4rem;color:var(--ok)"><b>${ok} / ${d.mod} transitions verified.</b></p>${un.length?`<h3>Unused states</h3>${un.map(x=>`<p style="margin:3px;font-size:1.05rem">${x[0]} · ${x[1]}</p>`).join('')}`:''}</div></div>`}}];
/* BCD-to-7-segment decoder design */
const DN=['D','C','B','A'],DV={},DQ={};'abcdefg'.split('').forEach(k=>{DV[k]=rg(16).map(s=>s>9?'x':SEG[s].includes(k)?'1':'0');DQ[k]=minCover(4,rg(10).filter(s=>SEG[s].includes(k)),[10,11,12,13,14,15])});
const DDS=[
{t:'Decoder Design · Step 1: Truth Table',n:8,f:u=>`<div class="sm">${tbl(['#','D','C','B','A',...'abcdefg'.split('')],rg(Math.min(16,(u+1)*2)).map(s=>[s,...bin(s,4).split(''),...'abcdefg'.split('').map(k=>DV[k][s]==='x'?'X':DV[k][s])]),Math.min(16,(u+1)*2)-1)}</div><p class="mu" style="font-size:1.05rem">1 = segment lit (common cathode). Inputs 1010–1111 never occur in BCD, so every output is a <b>don’t-care (X)</b>. For a common-anode display complement every output.</p>`},
{t:'Decoder Design · Step 2: K-map for Each Segment',n:7,f:u=>{const k='abcdefg'[u];return`<div class="cols">${kmap(DN,DV[k],DQ[k],`K-map for segment ${k}`)}<div class="det"><p>X cells (10–15) are used wherever they enlarge a loop.</p><h3>Equations so far</h3>${'abcdefg'.slice(0,u+1).split('').map(x=>`<div class="eq" style="font-size:1.15rem">${x} = ${sopn(DQ[x],DN)}</div>`).join('')}</div></div>`}},
{t:'Decoder Design · Step 3: Simplified Segment Equations',n:7,f:u=>{const L='abcdefg'.slice(0,u+1).split('');return L.map(k=>`<div class="eq">${k} = ${sopn(DQ[k],DN)}</div>`).join('')+(u===6?`<p class="mu" style="font-size:1.1rem">Total: ${'abcdefg'.split('').reduce((s,k)=>s+DQ[k].length,0)} product terms (before sharing); shared terms such as D′C′B′ reduce the gate count.</p>`:'')}},
{t:'Decoder Design · Step 4: Verification',n:1,f:()=>{const d=SD.d,rows=rg(10).map(s=>{const g='abcdefg'.split('').filter(k=>evC(DQ[k],s,4)).join('');return[s,b4(s),g.split('').join(' '),g===SEG[s]?'✓':'✗']});
 return`<div class="cols"><div class="sm"><table><tr><th>Digit</th><th>BCD</th><th>Segments from equations</th><th>OK</th></tr>${rows.map(r=>`<tr data-d="${r[0]}" class="${r[0]===d?'sel':''}">${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div><div class="det" style="text-align:center"><svg viewBox="-10 -4 80 108" style="width:150px">${seg(d,0,0,1)}</svg><p>Digit <b>${d}</b> · BCD ${bits(d)}</p><p style="font-size:1.4rem;color:var(--ok)"><b>${rows.filter(r=>r[3]==='✓').length} / 10 digits decoded correctly.</b></p><p class="mu" style="font-size:1rem">Click a row to display that digit.</p></div></div>`}}];

{t:'',n:1,i:()=>{const f=()=>{const d=new Date(),e=$('#hc');if(e)e.innerHTML=clk(dig6({h:d.getHours(),m:d.getMinutes(),s:d.getSeconds()}))};f();TT.push(setInterval(f,1000))},f:()=>`<div class="hero"><div class="kick">CASE STUDY · DIGITAL SYSTEM DESIGN</div><div class="big2">Real-Time Clock Design</div><p class="sub">Using Digital Counters, BCD Decoders and 7-Segment Displays</p><div id="hc" class="simdisp" style="max-width:640px;margin:8px auto"></div><div class="pres"><div class="av">SA</div><div><div class="by">Presented by</div><div class="pnm">Mr. S. Alwyn Rajiv</div><div class="prole">Assistant Professor, Department of ECE</div><div class="pcol">Kamaraj College of Engineering and Technology</div></div></div></div>`},
{t:'Step 1 · What is a Digital Clock?',n:4,f:u=>bul(['A digital clock <b>counts pulses</b> of a precise 1 Hz signal and shows hours, minutes and seconds with <b>no moving parts</b>.','Applications: wall and alarm clocks, microwave timers, computer RTC chips, industrial timers, embedded systems, dashboards.','Architecture: <b>oscillator → counters → decoders → displays</b> (next slide).','<b>Clock pulse ≠ displayed time:</b> the pulse is an electrical event once per second; the displayed time is the <b>count</b> of those pulses in BCD, decoded for the display.'],u)},
{t:'Step 1 · Block Diagram of a Digital Clock',n:6,f:u=>`${blocks(u)}<p style="font-size:1.5rem;margin-top:20px">${BCAP[u]}</p>${LEG}`},
{t:'Step 2 · Clock Pulse Generation',n:1,i:()=>{const upd=()=>{const a=$('#pc'),b=$('#et'),l=$('#pl');if(a){a.textContent=W2.n;b.textContent=(W2.n/W2.f).toFixed(1);l.classList.toggle('on')}};TT.push(setInterval(()=>{W2.n++;upd()},1000/W2.f))},f:()=>`<div class="cols"><div>${wave()}<div class="row">Frequency: ${[1,2,5].map(f=>`<button class="chip2 ${W2.f===f?'on':''}" data-f="${f}">${f} Hz</button>`).join('')}<span class="mu">Period T = 1/f = <b>${1/W2.f} s</b></span></div><p style="font-size:1.25rem">A <b>1 Hz</b> clock is made from a 32.768 kHz crystal and a divide-by-2¹⁵ chain (15 flip-flops). Each rising edge is one count: at 1 Hz, <b>one pulse = one second</b>.</p></div><div class="det" style="text-align:center"><h3>Live pulse counter</h3><span id="pl" class="lamp on" style="font-size:1.3rem">● CLK</span><div class="bigd" id="pc">${W2.n}</div><p>pulses → elapsed time <b id="et">${(W2.n/W2.f).toFixed(1)}</b> s</p><button data-f="r">Reset count</button></div></div>`},
{t:'Step 3 · MOD-N Counters',n:5,f:u=>tbl(['Counter','Flip-flops','States','Reset / rollover','Used for'],[['MOD-2','1 (toggle)','0, 1','Q toggles every pulse','÷2 divider'],['MOD-6','3','0–5','clear at 6 (110)','tens of seconds / minutes'],['MOD-10','4','0–9','clear at 10 (1010)','units digit (BCD decade)'],['MOD-60','MOD-10 + MOD-6 (7 FF)','00–59','59 → 00 + carry out','seconds, minutes'],['MOD-24','MOD-10 + MOD-3 (6 FF)','00–23','23 → 00 (clear at 24)','hours']].slice(0,u+1),u)},
{t:'Step 3 · Counter State Transitions',n:1,f:()=>{const c=C3,nb=Math.max(1,Math.ceil(Math.log2(c.mod))),dc={2:'none: Q toggles',6:'clear when count = 6 (110)',10:'clear when count = 10 (1010)',60:'59 → 00 (MOD-10 + MOD-6 cascade)'}[c.mod];return`<div class="cols"><div><div class="row">${[2,6,10,60].map(m=>`<button class="chip2 ${c.mod===m?'on':''}" data-m="${m}">MOD-${m}</button>`).join('')}</div><div class="det" style="text-align:center"><div class="bigd">${c.v}</div>${bits(c.v,Math.max(nb,1))}<p>State ${c.v} of 0…${c.mod-1} · ${dc}</p><div class="fl">${c.msg}</div><div class="row" style="justify-content:center"><button class="go" data-c3="p">Clock pulse ▶</button><button data-c3="10">+10</button><button data-c3="0">Reset</button></div></div></div><div class="det"><h3>Binary counting sequence (up-counter)</h3>${c.h.map((x,i)=>`<p style="margin:3px;${i===c.h.length-1?'color:var(--clk);font-weight:700':''}">${x}</p>`).join('')||'<p class="mu">Press Clock pulse.</p>'}<p class="mu" style="font-size:1rem">Rollover: after the last state the counter returns to 0.</p></div></div>`}},
...CDS,

casSlide('min',['<b>MU</b> (MOD-10) and <b>MT</b> (MOD-6) are identical to the seconds counters.','They are clocked by the <b>minute pulse</b> from the seconds counter (ST rolling 5 → 0), not by the 1 Hz clock.','Press the pulse button: 59 → 00 raises the carry for the hours counter.']),

{t:'Step 7 · BCD: Binary-Coded Decimal',n:10,f:u=>`<div class="cols"><div>${tbl(['Decimal','BCD (8421)'],[...Array(10).keys()].map(d=>[d,b4(d)]).slice(0,u+1),u)}</div><div class="det"><p>Each decimal digit uses <b>4 bits</b> (D C B A, weights 8-4-2-1). Codes 1010–1111 are unused.</p><p>Time <b>23:59:47</b> uses six digits:</p><p style="font-size:1.3rem;letter-spacing:.05em"><b>0010 0011 : 0101 1001 : 0100 0111</b></p><p class="mu" style="font-size:1.05rem">The counters already count in BCD, so their outputs feed the decoders directly.</p></div></div>`},

{t:'Interactive Real-Time Clock Simulator',n:1,f:()=>`<div class="row"><button class="go" data-sim="start">▶ Start</button><button data-sim="stop">■ Stop</button><button data-sim="reset">Reset</button><button data-sim="step">Step +1 s</button><label>Speed <select id="sp">${[[1000,'1 s (real time)'],[500,'0.5 s'],[200,'0.2 s'],[100,'0.1 s'],[20,'0.02 s']].map(([v,l])=>`<option value="${v}" ${SM.sp===v?'selected':''}>${l}</option>`).join('')}</select></label><label>Mode <select id="md"><option value="24" ${SM.m12?'':'selected'}>24-hour</option><option value="12" ${SM.m12?'selected':''}>12-hour</option></select></label><label>Set time <input id="si-h" value="${pad(SM.t.h)}"> : <input id="si-m" value="${pad(SM.t.m)}"> : <input id="si-s" value="${pad(SM.t.s)}"> <button data-sim="set">Set</button></label></div><div id="simd">${simHTML()}</div>`},

{t:'Case Study · Problem and Requirements',n:4,f:u=>bul(['<b>Problem:</b> design a 24-hour digital clock using cascaded digital counters and BCD-to-7-segment decoders.','<b>Function:</b> display HH:MM:SS from 00:00:00 to 23:59:59, advance once per second, roll over to 00:00:00 after 23:59:59.','<b>Hardware:</b> 1 Hz clock, six BCD counters (SU, ST, MU, MT, HU, HT), six decoders, six 7-segment displays.','<b>Constraints:</b> synchronous carry paths, glitch-free rollover, BCD outputs only (no binary conversion).'],u)},
{t:'Case Study · Counter Selection and MOD Calculation',n:CAS.length+1,f:u=>`${tbl(['Counter','Type','FFs','Range','Clear condition'],CAS.slice(0,u+1),Math.min(u,CAS.length-1))}${u===CAS.length?'<p style="font-size:1.3rem"><b>Seconds</b> 10 × 6 = <b>60</b> · <b>Minutes</b> 10 × 6 = <b>60</b> · <b>Hours</b> 24 · flip-flops = 7 + 7 + 6 = <b>20</b>.</p>':''}`},
{t:'Case Study · Rollover Logic Equations',n:6,f:u=>{const E=[['Clear SU = Q3 · Q1','count 1010 reached → back to 0'],['Carry SU = Q3 · Q0','SU = 9 → clocks ST'],['Clear ST = Q2 · Q1','count 0110 reached → back to 0'],['Minute pulse = (ST: Q2·Q0) · (SU: Q3·Q0)','59 → 00, clocks MU'],['Hour pulse = Minute pulse · (MT = 5) · (MU = 9)','59:59 → clocks HU'],['Clear hours = HT(Q1) · HU(Q2)','24 detected → 00']];return E.slice(0,u+1).map(e=>`<div class="eq">${e[0]} <small>— ${e[1]}</small></div>`).join('')}},

{t:'Testing and Verification',n:6,f:u=>{const rows=TESTS.slice(0,u+1).map(t=>{const r=tstr(nextT(t[0],t[1],t[2])),ok=r===t[3];return[tstr({h:t[0],m:t[1],s:t[2]}),t[3],r,ok?'✓ PASS':'✗ FAIL']});return tbl(['Initial time','Expected next','Simulated next','Result'],rows,u)+(u===5?'<p style="font-size:1.4rem;color:var(--ok)"><b>All 6 test cases passed.</b> Try them live in the simulator with “Set time”.</p>':'')}},

 $('#stage').innerHTML=`<div id="sc">${sl.t?`<h1>${sl.t}</h1>`:''}${sl.f(Math.min(pos.u,sl.n-1))}</div>`;$('#jump').value=pos.s;
 $('#prog').textContent=`Slide ${pos.s+1}/${SL.length} · step ${pos.u+1}/${sl.n}`;$('#fill').style.width=((pos.s+(pos.u+1)/sl.n)/SL.length*100)+'%';$('#sn').textContent=`${pos.s+1} / ${SL.length}`;fit();if(sl.i)sl.i()}
const next=()=>{const sl=SL[pos.s];if(pos.u<sl.n-1)pos.u++;else if(pos.s<SL.length-1){pos.s++;pos.u=0}render()};
const prev=()=>{if(pos.u>0)pos.u--;else if(pos.s>0){pos.s--;pos.u=SL[pos.s].n-1}render()};
$('#nx').onclick=next;$('#pv').onclick=prev;$('#all').onclick=()=>{pos.u=SL[pos.s].n-1;render()};
$('#jump').onchange=e=>{pos={s:+e.target.value,u:0};render()};
const theme=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'},full=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$('#th').onclick=theme;$('#fs').onclick=full;$('#fsb').onclick=full;
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if(e.key==='ArrowRight'||k===' '||e.key==='PageDown'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp')prev();else if(k==='f')full();else if(k==='t')theme();else if(k==='h')document.body.classList.toggle('clean')});
$('#stage').addEventListener('click',e=>{const b=e.target.closest('button,[data-d]');if(!b)return;const d=b.dataset;
 if(d.qz){const[id,a]=d.qz.split(':'),q=QS[id],n=(id==='act'?ACT:ASM).length;if(a[0]==='a')q.a[q.i]=+a.slice(1);else if(a==='n'){if(q.i<n-1)q.i++;else q.fin=1}else{q.i=0;q.a=[];q.fin=0}render();return}
 if(d.cs){const[k,a]=d.cs.split(':'),c=CS[k];if(a==='p')pulse(k);else if(a==='10')for(let i=0;i<10;i++)pulse(k);else{c.cu=c.ct=0;c.msg='';c.t=a==='0'?0:a==='9'?0:k==='hr'?2:5;c.u=a==='0'?0:a==='9'?9:k==='hr'?3:9}render();return}
 if(d.cdm){CD.mod=+d.cdm;pos.u=0;render();return}if(d.cdf){CD.ff=d.cdf;pos.u=0;render();return}
 if(d.m){C3.mod=+d.m;C3.v=0;C3.h=[];C3.msg='';render();return}
 if(d.c3){if(d.c3==='p')c3pulse();else if(d.c3==='10')for(let i=0;i<10;i++)c3pulse();else{C3.v=0;C3.h=[];C3.msg=''}render();return}
 if(d.f){if(d.f==='r')W2.n=0;else{W2.f=+d.f;W2.n=0}render();return}
 if(d.d!==undefined){SD.d=+d.d;render();return}if(d.ca!==undefined){SD.ca=+d.ca;render();return}
 if(d.t7){if(d.t7==='s')tick(T7);else if(d.t7==='m'){T7.s=0;T7.m=(T7.m+1)%60}else if(d.t7==='h')T7.h=(T7.h+1)%24;else if(d.t7==='e'){T7.h=23;T7.m=59;T7.s=55}else{T7.h=T7.m=T7.s=0}render();return}
 if(d.sim){const a=d.sim;if(a==='start'&&!SM.run)simStart();else if(a==='stop'){clearInterval(SM.timer);SM.run=0}else if(a==='step')SM.ev=tick(SM.t);else if(a==='reset'){SM.t={h:0,m:0,s:0};SM.ev={}}else if(a==='set'){const v=(id,mx)=>Math.min(mx,Math.max(0,parseInt($(id).value)||0));SM.t={h:v('#si-h',23),m:v('#si-m',59),s:v('#si-s',59)};SM.ev={}}drawSim();if(a==='reset'||a==='set'){['h','m','s'].forEach(x=>$('#si-'+x).value=pad(SM.t[x]))}}});
$('#stage').addEventListener('change',e=>{const t=e.target;if(t.id==='sp'){SM.sp=+t.value;if(SM.run)simStart()}if(t.id==='md'){SM.m12=t.value==='12'?1:0;drawSim()}});
scaleSlide();addEventListener('resize',()=>{scaleSlide();fit()});render();
</script></body></html>
