{t:"Errors in data transmission",sh:"Errors",pts:["Networks must move data from one device to another with <b>complete accuracy</b>, but data can be corrupted in transit. Errors must be detected and corrected for reliable communication.","Error control is done at the data link layer or the transport layer of the OSI model.","<b>Single bit error:</b> only one bit of the data string is in error; it affects only one character.","<b>Multiple bit error:</b> two or more <i>non-consecutive</i> bits are in error; it can affect several characters.","<b>Burst error:</b> two or more <i>consecutive</i> bits are in error. The burst length is counted from the first to the last bit in error.","<b>Forward error correction (FEC):</b> the receiver detects and corrects errors using the redundant (check) bits added by the sender. It needs no retransmission, but the more errors it must handle, the more redundancy it needs."],w:"err"},
{t:"How many redundancy bits?",sh:"Redundancy r",pts:["Hamming code was developed by R. W. Hamming. To correct an error, the receiver reverses the value of the altered bit, so it must know <b>which bit</b> is in error.","Let <b>m</b> = data bits, <b>r</b> = redundancy (Hamming) bits. The message sent has <b>m + r</b> bits.","r must be able to indicate at least m + r + 1 different states (no error, or an error in any one of the m + r positions):","<b>2<sup>r</sup> ≥ m + r + 1</b>","Example from the lecture: for 7-bit ASCII (m = 7) the smallest r is 4, because 2<sup>4</sup> = 16 ≥ 7 + 4 + 1 = 12, while r = 3 gives 8 ≥ 11, which is false."],w:"red"},
{t:"Positions of the redundancy bits",sh:"Positions",pts:["The bits are numbered from the <b>right</b>: position 1 is the least significant bit. Redundancy bits sit at positions that are <b>powers of 2</b>: 1, 2, 4, 8, …; the data bits fill the other positions.","Write each position in binary. Parity bit r<sub>k</sub> checks every position whose binary form has a 1 in the r<sub>k</sub> column. So:","<b>r1</b> = XOR(1, 3, 5, 7, 9, 11) · <b>r2</b> = XOR(2, 3, 6, 7, 10, 11)","<b>r4</b> = XOR(4, 5, 6, 7) · <b>r8</b> = XOR(8, 9, 10, 11)","Each data bit is covered by a unique combination of parity bits, and that is exactly what lets the receiver point to the failing position."],w:"pos"},
{t:"Encoder: step-by-step (transmitter)",sh:"Encode",pts:["Step 1: find r and place the data bits in the non-parity positions, MSB first (highest position).","Step 2: for each parity bit, XOR the bits it covers. With <b>even parity</b> the result is the value that makes the group contain an even number of 1s.","Step 3: write the finished code word from the highest position to position 1 and transmit it.","Lecture example: data <b>1001101</b> → r1 = 1, r2 = 0, r4 = 0, r8 = 1 → code <b>10011100101</b>. Try your own data (1 to 16 bits) below."],w:"enc"},
{t:"Transmitting and corrupting bits",sh:"Transmit",pts:["The sender transmits the code word (data + redundancy) over a noisy channel. The channel may flip one bit, several bits, or a burst.","Different data lengths need different overheads: 4 data bits need 3 check bits, 7 need 4, 8 need 4, 11 need 4, 16 need 5.","Pick a data length, corrupt the received code, press <b>Send</b> and watch the bits travel. The receiver then analyses what arrived."],w:"tx"},
{t:"Receiver: detect and correct",sh:"Decode",pts:["The receiver recomputes every parity group, now <b>including the received parity bit</b>. A group with an even number of 1s gives 0; otherwise 1.","The bits r8 r4 r2 r1 form the <b>syndrome</b>. Read as a binary number it is the <b>position of the bit in error</b>. 0000 means no error.","Correction: flip the bit at that position, then drop the redundancy bits to recover the data.","Lecture example: received 10010010101 → r1 = 1, r2 = 1, r4 = 1, r8 = 0 → syndrome 0111 = 7, so the bit at position 7 is in error."],w:"rx"},
{t:"Limits and extensions",sh:"Limits",pts:["Basic Hamming code has a <b>minimum distance of 3</b>: it corrects <b>1</b> bit error (or detects 2, but cannot tell the two cases apart).","With two bit errors the syndrome points at a wrong position, so the decoder “corrects” a good bit: a <b>mis-correction</b>. Burst errors are worse; burst-oriented codes (CRC, interleaving) handle them.","<b>SEC-DED:</b> add one overall parity bit p0. Then the receiver can <b>correct 1 error and detect 2 errors</b>. This extended Hamming code is used in ECC memory.","Compare: a single parity bit only detects an odd number of errors; Hamming adds correction at the price of more redundancy bits."],w:"lim"}];
