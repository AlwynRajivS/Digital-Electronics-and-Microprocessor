<style>






:root{--bg:#EDF1F4;--sf:#fff;--sf2:#E3E9EE;--ln:#C9D4DC;--ink:#0E2231;--mu:#4C6575;--ac:#A85F00;--onac:#fff;--tr:#0B7285;--ok:#167A45;--bad:#C0392B;--sh:0 8px 28px rgba(14,34,49,.10);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1822;--sf:#12232F;--sf2:#182E3C;--ln:#27424F;--ink:#E6EEF2;--mu:#93ABB8;--ac:#F0B45A;--onac:#0C1822;--tr:#5CC8D7;--ok:#5FD08F;--bad:#FF7A6B;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1822;--sf:#12232F;--sf2:#182E3C;--ln:#27424F;--ink:#E6EEF2;--mu:#93ABB8;--ac:#F0B45A;--onac:#0C1822;--tr:#5CC8D7;--ok:#5FD08F;--bad:#FF7A6B;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--fd);min-height:100%;transition:background .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800}h3{font-size:1.1rem;font-weight:600}
p{margin:0 0 1em;max-width:70ch}code,.m{font-family:var(--fm)}
button{font:inherit;color:inherit;cursor:pointer}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:16px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem}

#theme svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2}
main{max-width:1100px;margin:auto;padding:24px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px))}
section[hidden]{display:none}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.btn{background:var(--ac);color:var(--onac);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn.g{background:var(--sf2);color:var(--ink);border:1px solid var(--ln)}.btn:disabled{opacity:.45;cursor:not-allowed}
/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;margin-bottom:28px}
.hero h1{font-size:clamp(2.2rem,7vw,4rem);font-weight:800;margin-bottom:.3em}

.die{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;display:grid;gap:10px;box-shadow:var(--sh)}
.die .u{border:2px solid var(--tr);border-radius:12px;padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.die .u.e{border-color:var(--ac)}.die small{color:var(--mu);font-weight:400}
.q{display:flex;gap:5px}.q i{width:22px;height:22px;border-radius:5px;background:var(--sf2);border:1px solid var(--ln);animation:fl 3.6s infinite}
.q i:nth-child(2){animation-delay:.3s}.q i:nth-child(3){animation-delay:.6s}.q i:nth-child(4){animation-delay:.9s}.q i:nth-child(5){animation-delay:1.2s}.q i:nth-child(6){animation-delay:1.5s}
@keyframes fl{0%,35%{background:var(--tr);border-color:var(--tr)}50%,100%{background:var(--sf2);border-color:var(--ln)}}
/* learn */
.lg{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.mods{display:grid;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
.mods button{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:600}
.mods button[aria-current=true]{border-color:var(--ac);box-shadow:inset 4px 0 0 var(--ac)}
.mods .dot{margin-left:auto;width:18px;height:18px;border-radius:50%;border:2px solid var(--ln);flex:none}.mods .done .dot{background:var(--ok);border-color:var(--ok)}
.prog{height:8px;background:var(--sf2);border-radius:9px;overflow:hidden;margin-bottom:6px}.prog i{display:block;height:100%;background:var(--tr);width:0;transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--sf2);border-radius:12px;padding:12px}.stat b{display:block;font:600 1.35rem var(--fm);color:var(--tr)}.stat span{font-size:.85rem;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lg>*,.hero>*,.two>*{min-width:0}
body{overflow-x:hidden}
ul.k{padding-left:1.1em;margin:0 0 1em}ul.k li{margin:.3em 0}
.tip{border-left:4px solid var(--ac);background:var(--sf2);padding:12px 14px;border-radius:0 10px 10px 0;margin:14px 0}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:420px}
td,th{padding:9px 12px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}tr:last-child td{border:0}td:first-child{font:600 .95rem var(--fm);color:var(--ac);white-space:nowrap}
.fs{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:10px 0;font:600 .7rem var(--fm);text-align:center}
.fs span{padding:8px 0;border-radius:6px;background:var(--sf2);color:var(--mu)}.fs .c{background:var(--tr);color:var(--bg)}.fs .t{background:var(--ac);color:var(--onac)}
.mem{position:relative;height:46px;background:var(--sf2);border-radius:10px;margin:36px 0 26px;border:1px solid var(--ln)}
.mem b{position:absolute;top:0;bottom:0;display:grid;place-items:center;font:600 .8rem var(--fm);background:var(--tr);color:var(--bg);border-radius:6px;min-width:26px}
.mem b.cs{background:var(--ac);color:var(--onac)}.mem em{position:absolute;top:50px;font:.65rem var(--fm);color:var(--mu);font-style:normal;transform:translateX(-30%)}
.hl{position:absolute;border:3px solid #E0245E;border-radius:8px;box-shadow:0 0 0 9999px rgba(255,255,255,.55);transition:all .35s;pointer-events:none;opacity:0}.hl.on{opacity:1}
.hots{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}.hots button{border:1px solid var(--ln);background:var(--sf2);border-radius:99px;padding:7px 14px;font-weight:600;font-size:.9rem}.hots button[aria-pressed=true]{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.hint{font-size:.85rem;color:var(--mu);margin:6px 0 0}.dd{min-height:84px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,12,18,.88);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}#lb[hidden]{display:none}
.lbs{flex:1;overflow:auto;background:#fff;border-radius:12px;margin-top:10px;-webkit-overflow-scrolling:touch}.lbs img{display:block;width:160%;min-width:900px;max-width:none;height:auto}
.dgb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
/* practice */
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}.tabs button{white-space:nowrap;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:8px 16px;font-weight:600}
.tabs button[aria-selected=true]{background:var(--tr);color:var(--bg);border-color:var(--tr)}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}input,select{font:600 1.1rem var(--fm);padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:12px 0}
.out{font:600 clamp(1.6rem,6vw,2.6rem) var(--fm);color:var(--ac);word-break:break-all}.sub{font:.9rem var(--fm);color:var(--mu);word-break:break-all}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-top:12px}
.chip{border:2px solid var(--ln);border-radius:12px;padding:10px;text-align:center;font:600 .8rem var(--fm);color:var(--mu)}.chip b{display:block;font-size:1.5rem}.chip.on{border-color:var(--ac);color:var(--ac);background:var(--sf2)}
.qs{display:flex;gap:6px;margin:14px 0;min-height:30px}.qs span{flex:1;height:44px;border-radius:8px;border:1px dashed var(--ln);display:grid;place-items:center;font:600 .8rem var(--fm)}.qs .f{background:var(--tr);color:var(--bg);border:0}
.flip{perspective:900px;height:200px;cursor:pointer;width:100%;border:0;background:none;padding:0}.fi{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}.flip.o .fi{transform:rotateY(180deg)}
.fi>div{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--ln);display:grid;place-items:center;padding:20px;text-align:center;background:var(--sf2)}
.fi .b{transform:rotateY(180deg);background:var(--sf);border-color:var(--ac)}.fi .a{font:800 3rem var(--fm);color:var(--ac)}
/* assess */
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--ln);border-radius:12px;padding:12px 14px;margin:8px 0;font-weight:600}
.opt:hover{border-color:var(--tr)}.opt[aria-checked=true]{border-color:var(--ac);background:var(--sf2)}
.opt.ok{border-color:var(--ok)}.opt.no{border-color:var(--bad)}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font:800 2.4rem var(--fm);background:conic-gradient(var(--tr) calc(var(--p)*1%),var(--sf2) 0)}.ring span{width:118px;height:118px;border-radius:50%;background:var(--sf);display:grid;place-items:center}
.rv{padding:12px 0;border-bottom:1px solid var(--ln)}.rv .ex{color:var(--mu);font-size:.92rem}.tag{font:600 .8rem var(--fm)}.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.bn{display:none}
@media (max-width:760px){

 .hero,.lg,.two{grid-template-columns:1fr}.mods{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:6px}.mods button{white-space:nowrap}
 nav.top{display:none}main{padding-bottom:96px}.logo span{font-size:1.05rem}#theme{margin-left:auto}

 .fs{grid-template-columns:repeat(8,1fr);font-size:.7rem}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.dt{font:.9rem/1.6 var(--fm);color:var(--mu);word-break:break-word}.dt b{color:var(--ac)}

const M=[
["What is a PLD?",()=>`<p>Ordinary logic ICs (gates, adders, decoders) have a function fixed by the manufacturer. A <b>programmable logic device (PLD)</b> is an IC whose logic function is <b>defined by the user</b> after it is made, by choosing which internal connections are kept and which are removed.</p><ul class="k"><li>Any Boolean function can be written as a <b>sum of products</b>, so a PLD is built from a plane of <b>AND gates</b> followed by a plane of <b>OR gates</b>.</li><li>At every crossing of the arrays there is a link, often a fuse. A <b>programmed</b> link (shown as ×) connects the lines; a removed link leaves them separate.</li><li>One chip replaces many gate ICs, so designs are smaller, cheaper to change and quick to prototype.</li></ul>${LEG}<h3 class="sec">See the AND–OR planes work</h3><p>Pick a function and flip the inputs. Each row of × marks builds one product term; the OR gate adds the terms.</p>${expH()}<div class="tip"><b>Three families:</b> PROM, PLA and PAL differ only in <i>which</i> of the two planes can be programmed. The next module compares them.</div>`,()=>expInit()],
["PROM, PLA and PAL at a glance",()=>`<p>The three classic PLDs share one structure: inputs → AND array → OR array → outputs. What changes is which array is programmable.</p>${bkH()}<h3 class="sec">Differences</h3><div class="tw"><table class="cmp"><tr><th></th><th>PROM</th><th>PLA</th><th>PAL</th></tr>${CMPR.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</table></div><div class="tip"><b>Which one?</b> Few inputs and a look-up-table feel → PROM. Several outputs that share product terms → PLA. Simple, fast, low-cost logic where each output needs only a few terms → PAL.</div>`,()=>bkInit()],
["PROM: programmable read-only memory",()=>`<p>A <b>PROM</b> has a <b>fixed AND array</b> and a <b>programmable OR array</b>. The fixed AND array is a <b>decoder</b>: with n inputs it produces all 2ⁿ minterms. Programming the OR array selects which minterms are added to each output, so the PROM holds the <b>truth table</b>: the inputs are the address and the output bits are the stored word.</p><ul class="k"><li>Size: <b>2ⁿ words × m bits</b> (n inputs, m outputs).</li><li>Every function of n variables can be implemented, with no simplification at all.</li><li>The drawback: the number of rows <b>doubles with every added input</b>, so a PROM is practical only for few inputs.</li></ul>${LEG}<h3 class="sec">Design procedure</h3>${procH("PROM")}<h3 class="sec">Program a PROM yourself</h3><p>Tap the OR-array crosspoints to connect a minterm to an output. Load Problem 4 to see the worksheet answer.</p>${labH("lab-prom","prom")}`,()=>labInit("lab-prom","prom",PRESET.prom)],
["PROM tutorial problems",()=>`<p>Each problem follows the PROM design procedure: truth table → plan the OR array → draw the diagram → verify. The diagram uses the worksheet notation (• fixed AND link, × programmed OR link).</p>${PBL("PROM","tp-prom")}`,()=>pblInit("PROM","tp-prom")],
["PLA: programmable logic array",()=>`<p>A <b>PLA</b> has a <b>programmable AND array</b> and a <b>programmable OR array</b>. Only the product terms that are actually needed are built, and several outputs can <b>share</b> a term, so a PLA is far more economical than a PROM. Each output also ends in an <b>XOR gate</b> with a programmable input (0 or 1): tied to 0 the output is F, tied to 1 it is F'.</p><ul class="k"><li>Size is written <b>n × p × m</b>: inputs × product terms × outputs.</li><li>The PLA <b>program table</b> lists each product term with its input pattern (1 = true, 0 = complement, – = not used) and the outputs it feeds.</li><li>Because the polarity can be chosen, you implement <b>F or F'</b>, whichever gives fewer distinct terms overall.</li></ul>${LEG}<h3 class="sec">Design procedure</h3>${procH("PLA")}<h3 class="sec">Program a PLA yourself</h3><p>Tap crosspoints in either array, or the 0/1 polarity switch under an output.</p>${labH("lab-pla","pla")}`,()=>labInit("lab-pla","pla",PRESET.pla)],
["PLA tutorial problems",()=>`<p>Work through the worksheet PLA problems. Steps: simplify with K-maps → choose true or complement → PLA table → diagram → verify.</p>${PBL("PLA","tp-pla")}`,()=>pblInit("PLA","tp-pla")],
["PAL: programmable array logic",()=>`<p>A <b>PAL</b> has a <b>programmable AND array</b> and a <b>fixed OR array</b>. Each output gets its own fixed group of AND gates (for example 3), and its OR gate is wired to just those gates. Terms therefore <b>cannot be shared</b> between outputs, but the device is simpler, cheaper and faster than a PLA.</p><ul class="k"><li>Every output function must fit in the fixed number of product terms. If it needs more, <b>feed another output back</b> as an input (as W is fed back in Problems 2 and 6).</li><li>A PAL with 4 outputs and 3 terms each has <b>12 AND gates</b>; unused gates are simply left unprogrammed.</li><li>The PAL table groups the rows by output and adds a column for any feedback input.</li></ul>${LEG}<h3 class="sec">Design procedure</h3>${procH("PAL")}<h3 class="sec">Program a PAL yourself</h3><p>Tap the AND-array crosspoints to choose the literals of each product term. The OR array (•) is fixed: rows 1–2 feed X and rows 3–4 feed Y.</p>${labH("lab-pal","pal")}`,()=>labInit("lab-pal","pal",PRESET.pal)],
["PAL tutorial problems",()=>`<p>Work through the worksheet PAL problems. Steps: simplify with K-maps → check the product-term limit (and use feedback if needed) → PAL table → diagram → verify.</p>${PBL("PAL","tp-pal")}`,()=>pblInit("PAL","tp-pal")],
["Design procedure & summary",()=>`<div class="three">${["PROM","PLA","PAL"].map(t=>`<div class="cc"><b>${t} procedure</b><ol class="mini">${PROC[t].map(p=>`<li>${p[0]}</li>`).join("")}</ol></div>`).join("")}</div><h3 class="sec">Key facts</h3><div class="fm"><div>PROM<small>fixed AND, programmable OR, 2ⁿ × m</small></div><div>PLA<small>both programmable, n × p × m, shared terms, XOR polarity</small></div><div>PAL<small>programmable AND, fixed OR, t terms per output, feedback</small></div></div><h3 class="sec">Reading a PLD diagram</h3><ul class="k"><li>Each input gives a <b>true</b> line and a <b>complement</b> line (the buffer with a bubble).</li><li>A horizontal row ends in a <b>D-shaped AND gate</b>: the row is a product term.</li><li>The vertical lines to the right feed one <b>OR gate</b> per output.</li><li><b>×</b> = programmed link, <b>•</b> = fixed link.</li></ul><div class="tip">Next: use the Practice lab to design your own PLD, then take the assessment.</div>`,()=>{}]];

const Q=[["What is a programmable logic device (PLD)?",["An IC whose logic function is defined by the user after manufacture","A memory that can be written many times","A processor with a fixed instruction set","A clock circuit"],0,"A PLD’s internal connections are programmed by the user to realise a chosen logic function."],
["Which two arrays make up a basic PLD?",["A RAM array and a ROM array","An AND array followed by an OR array","Two OR arrays","An adder array and a latch array"],1,"Any Boolean function is a sum of products, so PLDs use an AND plane feeding an OR plane."],
["In a PROM, which array is fixed?",["The AND array","The OR array","Both arrays","Neither"],0,"A PROM’s fixed AND array is a decoder that generates all minterms; the OR array is programmed."],
["In a PAL, which array is programmable?",["Only the OR array","Only the AND array","Both arrays","Neither array"],1,"A PAL has a programmable AND array and a fixed OR array."],
["Which device has both the AND and OR arrays programmable?",["PROM","PLA","PAL","None of them"],1,"The PLA is the only one of the three with two programmable arrays."],
["A PROM has 3 inputs. How many product lines (minterms) does its AND array generate?",["3","6","8","16"],2,"2³ = 8 minterms."],
["What does a PLA size of 5 × 8 × 4 mean?",["5 outputs, 8 terms, 4 inputs","5 inputs, 8 product terms, 4 outputs","5 AND gates, 8 OR gates, 4 inverters","5 rows, 8 columns, 4 outputs"],1,"The notation is inputs × product terms × outputs (as in Problem 5)."],
["Why do PLA outputs end in an XOR gate?",["To add the output to the input","To select the true or complement form of the function","To store the output","To generate the product terms"],1,"The XOR input is tied to 0 (output = F) or 1 (output = F')."],
["In Problem 1, why is F₂ built as F₂' = AC + AB + A'B'C'?",["F₂' shares the terms AC and AB with F₁, so only 4 product terms are needed in total","F₂ cannot be simplified","The PLA cannot produce true outputs","F₂' has fewer inputs"],0,"F₁ = AC + AB + BC and F₂' = AC + AB + A'B'C' share AC and AB: 4 distinct terms instead of 6."],
["What is the simplified form of F₁ = Σ(3, 5, 6, 7) in Problem 1?",["AB + BC + AC","A + B + C","ABC","A'B'C'"],0,"It is the majority function: the groups {3,7}, {5,7} and {6,7}."],
["How many product terms must a PAL output have, at most, in Problems 2, 6, 8 and 10?",["2","3","4","12"],1,"Each output of the PAL used there has 3 AND gates, so at most 3 terms."],
["In Problem 2, why is W fed back to the input of the PAL?",["Because W is an input signal","To reduce Z to three product terms (Z = W + AC'D' + A'B'C'D)","To invert the output W","To remove the OR array"],1,"Z would need four terms, but two of them make up W. Feeding W back leaves three."],
["A PAL has 4 outputs with 3 product terms each. How many AND gates (rows) does it have?",["3","4","7","12"],3,"4 × 3 = 12 rows, as in the worksheet PAL tables."],
["In Problem 4 (PROM), F₁ = Σ(4, 5, 7). How many OR-array crosspoints are programmed in the F₁ column?",["1","3","4","8"],1,"One × for each minterm where F₁ = 1: rows 4, 5 and 7."],
["For Problem 4, how many OR-array crosspoints are programmed in total for F₁ and F₂?",["3","6","8","16"],1,"F₁ has 3 and F₂ = Σ(3, 5, 7) also has 3: 6 crosspoints out of 16."],
["In the BCD to Excess-3 converter (Problems 7 and 8), E₀ equals:",["B₀'","B₀","B₁ + B₀","B₃"],0,"The Excess-3 code’s least significant bit is the complement of the BCD’s least significant bit."],
["Problem 7 implements the BCD to Excess-3 converter with a PLA. How many distinct product terms does it need?",["4","6","9","12"],2,"B₃, B₂B₀, B₂B₁, B₂'B₀, B₂'B₁, B₂B₁'B₀', B₁'B₀', B₁B₀ and B₀' make 9 terms."],
["Why can the BCD codes 1010 to 1111 be treated as don’t-cares in Problems 7 and 8?",["They are invalid BCD digits that never occur","They always produce 0","They are the same as 0000","The PLD ignores them in hardware"],0,"A BCD digit is 0–9, so those six input combinations never occur and may be used to make groups larger."],
["What is the main difference between a PLA and a PAL regarding product terms?",["A PLA can share product terms between outputs; in a PAL each output has its own fixed terms","A PAL can share terms; a PLA cannot","Neither can share terms","A PLA has no product terms"],0,"The programmable OR array of a PLA lets outputs share terms; the fixed OR array of a PAL does not."],
["What is the drawback of using a PROM to implement logic with many inputs?",["The number of rows doubles with every added input","It cannot be programmed","It has no OR array","It needs feedback"],0,"A PROM generates all 2ⁿ minterms, so its size grows exponentially with n."]];
