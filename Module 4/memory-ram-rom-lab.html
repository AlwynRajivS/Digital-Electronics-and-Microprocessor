.prog{height:8px;background:var(--sf2);border-radius:9px;overflow:hidden;margin-bottom:6px}.prog i{display:block;height:100%;background:var(--tr);width:0;transition:width .4s}

body{overflow-x:hidden}
ul.k{padding-left:1.1em;margin:0 0 1em}ul.k li{margin:.3em 0}

.mem b.cs{background:var(--ac);color:var(--onac)}.mem em{position:absolute;top:50px;font:.65rem var(--fm);color:var(--mu);font-style:normal;transform:translateX(-30%)}

#lb{position:fixed;inset:0;z-index:50;background:rgba(5,12,18,.88);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}#lb[hidden]{display:none}
.lbs{flex:1;overflow:auto;background:#fff;border-radius:12px;margin-top:10px;-webkit-overflow-scrolling:touch}.lbs img{display:block;width:160%;min-width:900px;max-width:none;height:auto}
.dgb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}

/* practice */

.bn{display:none}

/* ===== modules ===== */
const RAMROM=[["RAM","Random-access memory. Can perform both write and read operations. Stores new information for later use.","Volatile (CMOS RAM)"],["ROM","Read-only memory. Can only be read; the information is already stored and cannot be altered by writing.","Non-volatile"]];
const M=[
["Memory: the big picture",()=>`<p>A <b>memory unit</b> is a device to which binary information is transferred for storage and from which information is retrieved when needed for processing. It is a collection of cells, each able to store binary information.</p><ul class="k"><li>During data processing, information moves from memory into selected registers of the processing unit.</li><li>Intermediate and final results go back to memory.</li><li>Information from an input device is stored in memory; information for an output device is taken from memory.</li></ul>${fxH()}<h3 class="sec">Extra: the memory hierarchy</h3><p>Real computers use several kinds of memory together, trading speed against size and cost.</p>${hierH()}`,()=>hierInit()],
["Words, bytes & capacity",()=>`<p>A memory stores binary information in groups of bits called <b>words</b>. A word is a group of 1s and 0s that may be a number, an instruction, one or more characters, or any other binary-coded information. A group of 8 bits is a <b>byte</b>, and most computer memories use word lengths that are multiples of 8 bits.</p>${wbH()}<p style="margin-top:12px">The capacity of a memory unit is usually stated as the total number of bytes it can store. Memories range from <b>1,024 words</b> (10 address bits) up to <b>2<sup>32</sup> words</b> (32 address bits). Capacity is quoted with K, M and G:</p><div class="fm"><div>K = 2<sup>10</sup><small>1,024</small></div><div>M = 2<sup>20</sup><small>1,048,576</small></div><div>G = 2<sup>30</sup><small>1,073,741,824</small></div></div><p>So 64K = 2<sup>16</sup>, 2M = 2<sup>21</sup> and 4G = 2<sup>32</sup>.</p><h3 class="sec">Worked examples from the lecture</h3><ul class="k"><li><b>1K words of 16 bits:</b> 1K = 1,024 = 2<sup>10</sup>, and 16 bits are two bytes, so the memory holds 2,048 bytes = <b>2K bytes</b>.</li><li><b>64K × 10:</b> 64K = 2<sup>16</sup>, so it needs <b>16 address bits</b>, and each word has 10 bits.</li><li>The number of address bits comes from <b>2<sup>k</sup> ≥ m</b>, where m is the number of words.</li></ul>${capH()}`,()=>{wbInit();capInit()}],
["The memory unit: read & write",()=>`<p>The memory unit is specified by the <b>number of words</b> it contains and the <b>number of bits in each word</b>. The <b>address lines</b> select one particular word. Each word is given an identification number, its <b>address</b>, from 0 up to <b>2<sup>k</sup> − 1</b>, where k is the number of address lines. Selecting a word means applying its k-bit address to the address lines.</p><ul class="k"><li><b>Write</b>: the process of storing new information in memory.</li><li><b>Read</b>: transferring stored information out of memory (the word stays in memory).</li></ul>${dgH("mu","Block diagram of a memory unit: k address lines, Read, Write, n data input lines, n data output lines","Block diagram from the lecture.")}<h3 class="sec">Try a 1024 × 16 memory</h3><p>Set an address, flip the input bits, then Read or Write. The six rows below are the ones shown in the lecture (addresses 0, 1, 2, 1021, 1022 and 1023); the other 1,018 words hold made-up values.</p>${muH()}`,()=>muInit()],
["RAM, ROM & volatility",()=>`<p>Two types of memory are used in digital systems: <b>random-access memory (RAM)</b> and <b>read-only memory (ROM)</b>.</p><div class="tw"><table><tr><th>Type</th><th>What it does</th><th>Power off</th></tr>${RAMROM.map(r=>`<tr><td>${r[0]}</td><td style="white-space:normal;font-family:var(--fd);color:var(--ink)">${r[1]}</td><td style="white-space:normal;font-family:var(--fd);color:var(--ink)">${r[2]}</td></tr>`).join("")}</table></div><h3 class="sec">Volatile and non-volatile</h3><ul class="k"><li><b>Volatile</b> memory loses its information when power is turned off. CMOS integrated-circuit RAMs, both static and dynamic, are volatile because their binary cells need external power.</li><li><b>Non-volatile</b> memory keeps its information after power is removed. A magnetic disk keeps its data as the <i>direction of magnetization</i>. ROM is also non-volatile.</li></ul>${volH()}`,()=>volInit()],
["SRAM vs DRAM",()=>`<p>There are two types of RAM. They store a bit in very different ways.</p><div class="two2"><div class="cc"><b>SRAM</b><small>Static RAM. Internal <b>latches</b> store the binary information. More reliable but expensive; typically used for cache memories; consumes more power.</small></div><div class="cc"><b>DRAM</b><small>Dynamic RAM. Contents are stored as <b>charge in a small capacitor</b>, which must be re-charged from time to time. The bulk of PC memory is DRAM.</small></div></div><div class="two2" style="margin-top:10px"><div>${sramSvg}<small class="sub" style="display:block;text-align:center">SRAM cell: a latch of two inverters plus two access transistors</small></div><div>${dramSvg}<small class="sub" style="display:block;text-align:center">DRAM cell: one transistor and one capacitor</small></div></div>${dgH("cells","Transistor-level schematics of an SRAM cell and a DRAM cell","Static RAM and dynamic RAM cells from the lecture.")}<h3 class="sec">Why refresh?</h3>${drH()}<div class="tip"><b>Extra context:</b> because a DRAM cell is so small, DRAM packs far more bits per chip and costs less per bit than SRAM, while SRAM is faster. That is why caches use SRAM and main memory uses DRAM.</div>`,()=>drInit()],
["Inside a RAM: the cell and a 4 × 4 array",()=>`<p>The internal construction of a RAM of <b>m words</b> and <b>n bits per word</b> consists of <b>m × n binary storage cells</b> and the decoding circuits that select individual words. The <b>binary cell (BC)</b> is the basic building block of a memory unit.</p>${dgH("bc","Logic diagram of a binary storage cell with SR latch, and its block symbol","Binary cell from the lecture: SR latch, AND gates, Select and Read/Write.")}${bcH()}<h3 class="sec">A 4 × 4 RAM</h3><p>Four words of four bits use <b>16 cells</b>. A <b>2 × 4 decoder</b> turns the two address bits into one of four word lines, and the <b>memory enable (EN)</b> input switches the decoder on. The cells of the selected word are connected to the input data lines (write) or, through OR gates, to the output data lines (read).</p>${dgH("ram44","4 by 4 RAM: 2 by 4 decoder, sixteen binary cells, OR gates on the outputs","4 × 4 RAM from the lecture.")}${r44H()}<h3 class="sec">Commercial RAMs</h3><p>Commercial RAMs hold thousands of words, and each word may be anywhere from <b>1 to 64 bits</b>. A memory with 2<sup>k</sup> words of n bits needs <b>k address lines into a k × 2<sup>k</sup> decoder</b>; each decoder output selects one word of n bits for reading or writing. The next module shows why this gets expensive.</p>`,()=>{bcInit();r44Init()}],
["Coincident decoding",()=>`<p>For a 1K-word memory, a single <b>10 × 1,024 decoder</b> would need 1,024 AND gates, each with 10 inputs. <b>Coincident decoding</b> uses <b>two 5 × 32 decoders</b> instead: the address is split into <b>X</b> (the first five bits) and <b>Y</b> (the last five). The X decoder drives one of 32 row lines and the Y decoder one of 32 column lines, and the cell where the two selected lines <b>coincide</b> is the one chosen.</p>${dgH("coin","Coincident decoding: a 5 by 32 X decoder, a 5 by 32 Y decoder, and a 32 by 32 grid","Lecture example: binary address 01100 10100, so X = 12 and Y = 20.")}${coH()}`,()=>coInit()],
["Address multiplexing (DRAM)",()=>`<p>Large DRAMs need many address lines, which means many pins. <b>Address multiplexing</b> saves pins by sending the address in <b>two halves over the same pins</b>. A 64K DRAM needs 16 address bits but has only an <b>8-bit address</b> input: first the <b>row address</b> is applied and latched by ${RAS} (row address strobe), then the <b>column address</b> is applied and latched by ${CAS} (column address strobe). The 8 × 256 decoders each select one line of the 256 × 256 cell array.</p>${dgH("mux","Address multiplexing for a 64K DRAM: row register, column register, 8 by 256 decoders, 256 by 256 cell array","64K DRAM block diagram from the lecture.")}<h3 class="sec">Run one access</h3>${mxH()}`,()=>{$("#mxgo").onclick=mxRun}],
["Read-only memory (ROM)",()=>`<p>A <b>ROM</b> can perform only the <b>read</b> operation. Its binary information is already stored inside and can be read at any time, but it <b>cannot be altered by writing</b>. A ROM is a <b>programmable logic device (PLD)</b>. Its block diagram has <b>k inputs</b> (the address) and <b>n outputs</b> (the data), which makes a 2<sup>k</sup> × n ROM.</p><h3 class="sec">Internal logic of a 32 × 8 ROM</h3><p>Five address inputs I<sub>4</sub>…I<sub>0</sub> feed a <b>5 × 32 decoder</b>. Its 32 outputs are the word lines. Eight <b>OR gates</b>, one per output A<sub>7</sub>…A<sub>0</sub>, collect the word lines; a <b>connection</b> (programmed link) at a crossing decides whether that word line puts a 1 on that output.</p>${dgH("rom","Internal logic of a 32 by 8 ROM: 5 by 32 decoder, 32 word lines and 8 OR gates","32 × 8 ROM from the lecture.")}${romH()}<div class="tip"><b>Extra context: ROM as a lookup table.</b> Load “Squares 0–15”: the address is the input and the data is the square of that number. Any combinational circuit with 5 inputs and 8 outputs can be built as a 32 × 8 ROM, simply by programming its truth table.</div>`,()=>romInit()],
["ROM types: PROM, EPROM, EEPROM",()=>`<div class="tw"><table><tr><th>Type</th><th>Programmed</th><th>Erased</th></tr><tr><td>PROM</td><td style="white-space:normal;font-family:var(--fd);color:var(--ink)">Once, after it is created. Permanent.</td><td style="white-space:normal;font-family:var(--fd);color:var(--ink)">Cannot be erased. If it has an error the chip is discarded and a new PROM is made.</td></tr><tr><td>EPROM</td><td style="white-space:normal;font-family:var(--fd);color:var(--ink)">Needs special equipment.</td><td style="white-space:normal;font-family:var(--fd);color:var(--ink)">By shining UV light on the IC. Not used in computers today.</td></tr><tr><td>EEPROM</td><td style="white-space:normal;font-family:var(--fd);color:var(--ink)">Electrically, repeatedly, without removing it from the computer.</td><td style="white-space:normal;font-family:var(--fd);color:var(--ink)">Electrically, using a higher-than-normal voltage. Erased and reprogrammed in its <b>entirety</b>, not selectively.</td></tr></table></div><ul class="k" style="margin-top:12px"><li>An EEPROM has a <b>limited life</b>: it can be reprogrammed only tens or hundreds of thousands of times. In a system that reprograms it often, this is a design consideration.</li><li><b>Flash memory</b> is a special form of EEPROM that uses normal PC voltages for erasure and reprogramming.</li></ul><h3 class="sec">ROM programming lab</h3><p>Each cell starts at 1. Programming can only change 1 → 0, and erasing sets everything back to 1. Try each chip type.</p>${rtH()}`,()=>rtInit()],
["Building bigger memories",()=>`<p><b>Extra topic.</b> Memory chips come in fixed sizes, so a larger memory is built from several chips. There are two kinds of expansion, and real designs use both:</p><ul class="k"><li><b>More bits per word:</b> put chips side by side. They share the same address lines and each supplies part of the word.</li><li><b>More words:</b> stack rows of chips. The low address bits go to every chip, and the upper bits go to a <b>decoder</b> that enables one row through the chip selects (like the I/O decoders in the interfacing lab).</li></ul><p>Number of chips = (words needed ÷ words per chip) × (bits needed ÷ bits per chip).</p>${xpH()}`,()=>xpInit()],
