<main id="wrap"><div id="slide"><div id="stage"></div><div class="sf"><span>Kamaraj College of Engineering and Technology · Department of ECE</span><span id="sn"></span></div></div></main><div id="bar"><div id="fill"></div></div>
<footer><button id="nx">Next ▶</button><button id="pv">◀ Previous</button><button id="all">Reveal all</button><button id="auto">▶ Auto</button><span class="mu" id="prog"></span><span style="flex:1"></span><span class="mu">→ / Space next · ← back · F full · T theme · H clean view</span><button id="th">Theme</button><button id="fs">Fullscreen</button></footer>
<script>
const $=s=>document.querySelector(s), bin=(v,n)=>v.toString(2).padStart(n,'0');
const TYPES={up:'Synchronous Up',down:'Synchronous Down',updown:'Up-Down',ripple:'Asynchronous (Ripple)',modn:'MOD-N',ring:'Ring',johnson:'Johnson',custom:'Custom / Random / LFSR'};
const S={type:'up',n:3,ff:'T',N:6,dir:1,rst:'sync',hist:[],k:0,timer:null,guide:0,all:false,custom:true,lfsr:false};

/* ---- Flip-flop data ---- */
const FF={
 T:{pins:['T'],eq:"Q+ = T ⊕ Q",note:"T=1 toggles, T=0 holds. No invalid inputs.",exc:{'00':['0'],'01':['1'],'10':['1'],'11':['0']}},
 D:{pins:['D'],eq:"Q+ = D",note:"Output follows D at the clock edge.",exc:{'00':['0'],'01':['1'],'10':['0'],'11':['1']}},
 JK:{pins:['J','K'],eq:"Q+ = JQ' + K'Q",note:"J=K=1 toggles. All combinations valid.",exc:{'00':['0','x'],'01':['1','x'],'10':['x','1'],'11':['x','0']}},
 SR:{pins:['S','R'],eq:"Q+ = S + R'Q",note:"S=R=1 is INVALID (forbidden), so SR must never be driven that way.",exc:{'00':['0','x'],'01':['1','0'],'10':['0','1'],'11':['x','0']}}};

/* ---- Counter model: start state + next-state function f(s,m) ---- */
function model(){
 const t=S.type; let n=S.n, M=2**n, f, start=0, hasM=false, err='';
 if(t==='up'||t==='ripple') f=s=>(s+1)%M;
 else if(t==='down') f=s=>(s+M-1)%M;
 else if(t==='updown'){hasM=true;f=(s,m)=>m?(s+1)%M:(s+M-1)%M;}
 else if(t==='modn'){n=Math.max(1,Math.ceil(Math.log2(S.N)));M=2**n;f=s=>s<S.N?(s+1)%S.N:null;}
 else if(t==='ring'){start=1<<(n-1);f=s=>(s>>1)|((s&1)<<(n-1));}
 else if(t==='johnson'){f=s=>(s>>1)|(((~s)&1)<<(n-1));}
 else {
  if(S.lfsr){start=1;f=s=>((s<<1)&(M-1))|(((s>>(n-1))^(s>>(n-2)))&1);}
  else{
   const q=S.cust.split(/[,\s>→-]+/).filter(Boolean).map(x=>/^[01]+$/.test(x)&&x.length>1?parseInt(x,2):parseInt(x,10));
   const need=Math.max(...q.map(v=>Math.ceil(Math.log2(v+1))||1),1); if(need>n){n=need;M=2**n}
   const map={};start=q[0];
   q.forEach((v,i)=>{const nx=q[(i+1)%q.length]; if(v in map&&map[v]!==nx)err='State '+v+' has two different successors.'; map[v]=nx;});
   f=s=>(s in map)?map[s]:null;}
 }
 const used=new Set();let c=start;
 for(const m of hasM?[0,1]:[0]){c=start;for(let i=0;i<300&&!used.has(c*2+m+1000*0);i++){used.add(c*2+m);if(f(c,m)==null)break;c=f(c,m);}}
 const states=new Set([...used].map(x=>x>>1)); // used states
 return{n,M,f,start,hasM,states,err};
}

/* ---- Quine-McCluskey minimiser (don't-cares supported) ---- */
function qm(v,ones,dcs){
 if(!ones.length)return['0'];
 let terms=[...new Set([...ones,...dcs])].map(x=>bin(x,v)),primes=new Set();
 const comb=(a,b)=>{let d=-1;for(let i=0;i<a.length;i++){if(a[i]!==b[i]){if(a[i]==='-'||b[i]==='-'||d>=0)return -1;d=i;}}return d};
 while(terms.length){const used=new Set(),nx=new Set();
  for(let a=0;a<terms.length;a++)for(let b=a+1;b<terms.length;b++){const d=comb(terms[a],terms[b]);if(d>=0){nx.add(terms[a].slice(0,d)+'-'+terms[a].slice(d+1));used.add(a);used.add(b);}}
  terms.forEach((t,i)=>{if(!used.has(i))primes.add(t)});terms=[...nx];}
 const cov=(p,m)=>[...p].every((c,i)=>c==='-'||c===m[i]),lit=p=>[...p].filter(c=>c!=='-').length;
 let rem=ones.map(x=>bin(x,v)),res=[];
 while(rem.length){let best=null,bc=-1;
  for(const p of primes){const c=rem.filter(m=>cov(p,m)).length;if(c>bc||(c===bc&&lit(p)<lit(best))){best=p;bc=c}}
  res.push(best);rem=rem.filter(m=>!cov(best,m));}
 const nm=p=>v-1-p; // string index -> variable position
 return res.map(p=>{const parts=[];[...p].forEach((c,i)=>{if(c!=='-')parts.push(VN(nm(i))+(c==='0'?"'":''))});return parts.join('·')||'1'});
}
let CUR_N=3;const VN=p=>p<CUR_N?'Q'+p:'M';

/* ---- Synthesis: excitation table + Boolean equations ---- */
function synth(){
 const md=model(),n=md.n;CUR_N=n;const v=n+(md.hasM?1:0),size=1<<v,pins=FF[S.ff].pins,rows=[];
 const val={};pins.forEach(p=>{for(let i=0;i<n;i++)val[p+i]=Array(size).fill('x')});
 for(let m=0;m<(md.hasM?2:1);m++)for(let s=0;s<2**n;s++){
  if(!md.states.has(s))continue;const nx=md.f(s,m);if(nx==null)continue;
  const idx=(m<<n)|s,row={s,m,nx,ex:{}};
  for(let i=0;i<n;i++){const key=((s>>i)&1)+''+((nx>>i)&1),e=FF[S.ff].exc[key];
   pins.forEach((p,j)=>{val[p+i][idx]=e[j];row.ex[p+i]=e[j]});}
  rows.push(row);}
 const eqs={};
 for(const k in val){const ones=[],dcs=[];val[k].forEach((x,i)=>{if(x==='1')ones.push(i);else if(x==='x')dcs.push(i)});eqs[k]=qm(v,ones,dcs).join(' + ');}
 if(S.type==='ripple'){for(let i=0;i<n;i++){pins.forEach(p=>eqs[p+i]=S.ff==='D'?`Q${i}'`:S.ff==='SR'?(p==='S'?`Q${i}'`:`Q${i}`):'1');}}
 return{md,n,rows,eqs,pins,val,unused:[...Array(2**n).keys()].filter(s=>!md.states.has(s))};
}

/* ---- Gate-level circuit renderer (textbook style: FFs left to right, LSB first) ---- */
function circuit(upto=D.n,id='svg',compact=false){
 const n=D.n,P=D.pins,cur=S.hist[S.k],prev=S.hist[S.k-1],tg=prev?cur.s^prev.s:0,FW=96,GAP=64,RS=16,LS=7,AW=34,OW=40,rip=S.type==='ripple',two=P.length>1;
 const pr=l=>l.replace(/'/g,'\u2032'),Dn=(l)=>`<text x="0" y="0">${l}</text>`;
 const val=l=>{if(l==='HIGH')return 1;const c=l.endsWith("'"),b=l.replace("'",'');const v=b==='M'?(S.dir?1:0):(cur.s>>+b.slice(1))&1;return c?1-v:v};
 const terms=k=>{const e=D.eqs[k];return e==='0'?[]:e==='1'?[['HIGH']]:e.split(' + ').map(t=>t.split('\u00b7'))};
 const lits=new Set();for(let i=0;i<n;i++)P.forEach(p=>terms(p+i).forEach(t=>t.forEach(l=>lits.add(l))));
 const usedRev=new Set();for(let i=0;i<Math.min(upto,n);i++)P.forEach(p=>terms(p+i).forEach(t=>t.forEach(l=>usedRev.add(l))));
 const ord=l=>l==='HIGH'?-1:l[0]==='M'?1000+l.length:(+l[1])*2+(l.endsWith("'")?1:0);
 const rails=[...lits].sort((a,b)=>ord(a)-ord(b)),ry={};rails.forEach((l,r)=>ry[l]=28+r*RS);
 const railBot=28+Math.max(rails.length,1)*RS,slot=t=>t.length>1?t.length*14+16:24;
 const bh=ts=>Math.max(24,ts.reduce((a,t)=>a+slot(t),0));
 let maxH0=0;for(let i=0;i<n;i++)maxH0=Math.max(maxH0,bh(terms(P[0]+i)));
 const pin0Y=railBot+26+maxH0,y0=pin0Y-26,h=two?112:96,cy=pin0Y+(two?25:40),cpY=y0+h+40;
 let o='',x=84;const cols=[];
 for(let i=0;i<n;i++){
  const tl=P.map(p=>terms(p+i)),nl=tl.flat().reduce((a,t)=>a+t.length,0),anyAnd=tl.flat().some(t=>t.length>1),anyOr=tl.some(t=>t.length>1);
  const gaW=30+nl*LS+10+(anyAnd?AW:0)+(anyOr?16+OW:0)+P.length*7+20,laneX0=x+26,andX=laneX0+nl*LS+10,txOut=andX+(anyAnd?AW:0),orX=txOut+16,FFx=x+gaW;
  const q=(cur.s>>i)&1,hot=(tg>>i)&1,qy=y0+26,qby=y0+h-22,xr=FFx+FW;let L=0;
  // gate networks per input pin
  P.forEach((p,j)=>{if(i>=upto)return;const ts=tl[j],pinY=pin0Y+(j?50:0),top=j?pinY:pin0Y-bh(ts),act=evalEq(D.eqs[p+i],cur.s,S.dir);let cyc=top;const outs=[];
   ts.forEach(t=>{let ty,gy,gh;

 {t:'Types of counters',n:CARDS.length,f:u=>{const c=CARDS[u];return`<div class="two"><div class="lst">${CARDS.map((x,i)=>`<div class="${i===u?'cur':i>u?'dim2':''}">${i<=u?x[1]:'\u2022\u2022\u2022'}</div>`).join('')}</div><div class="det"><h2>${c[1]}</h2><p><b>Definition:</b> ${c[2]}</p><p><b>Working:</b> ${c[3]}</p><p><b>Sequence:</b> <code>${c[4]}</code></p><p><b>Applications:</b> ${c[5]}</p><p class="mu">${c[6]}</p></div></div>`}},
 {t:'Applications of counters',n:4,f:u=>`<div class="cols">${APPS.slice(0,(u+1)*3).map((a,i)=>`<div style="margin:.5rem 0;opacity:${i>=u*3?1:.7}"><h2 style="font-size:1.4rem;margin:0">${a[0]}</h2><div style="font-size:1.15rem">${a[1]}</div></div>`).join('')}</div>`},
 {t:'Counter design procedure',n:8,f:u=>{const P8=[['Counting sequence','List the states and find n = \u2308log\u2082 N\u2309 flip-flops'],['State diagram','Draw the transitions and the present \u2192 next state table'],['Flip-flop tables','Characteristic and excitation table of the chosen flip-flop'],['Counter excitation table','Find every flip-flop input for every transition'],['K-map simplification','Minimise each input; unused states are don\u2019t-cares'],['Logic diagram','Draw the gates and flip-flops from the expressions'],['Operation','Clock the circuit; check the timing diagram and unused states'],['Summary','Final expressions and counting sequence']];return`<div class="proc">${P8.map((p,i)=>`<div class="pi ${i<u?'done':i===u?'now':''}" style="${i>u?'opacity:.25':''}"><div class="pn">${i<u?'\u2713':i+1}</div><div><b>${p[0]}</b><div class="mu">${p[1]}</div></div></div>`).join('')}</div>`}},
 {t:'Select the counter to design',n:1,key:'select',f:()=>{const ty=S.type,ok=S.pt&&S.pf;
 const card=(k,i)=>{const c=CARDS.find(x=>x[0]===k);return`<button style="--i:${i}" class="opt ${S.pt&&ty===k?'sel':''}" data-ty="${k}"><b>${TYPES[k]}</b><span>${c[4]}</span></button>`};
 const par=!S.pt?'':ty==='modn'?`<h3>MOD-N (2 to 16)</h3><input id="modN" type="number" min="2" max="16" value="${S.N}" style="width:6rem">`:`<h3>Number of bits</h3><div class="row">${chips([2,3,4],S.n,'data-nb')}</div>`;
 const dr=S.pt&&ty==='updown'?`<h3>Starting direction</h3><div class="row">${chips([1,0],S.dir,'data-dir',k=>k?'UP':'DOWN')}</div>`:'';
 const cu=S.pt&&ty==='custom'?`<h3>Custom sequence (binary or decimal, comma separated)</h3><input id="cust" value="${S.cust}"><div class="row" style="margin-top:.5rem"><button id="rnd">Random sequence</button><button id="lf" class="${S.lfsr?'on':''}">LFSR (pseudo-random)</button></div><p class="mu">${S.lfsr?'LFSR: deterministic and periodic, not a true random generator.':'A custom sequence is chosen by the designer.'}</p>`:'';
 return`<h3>1 \u00b7 Choose the counter type</h3><div class="optg">${Object.keys(TYPES).map(card).join('')}</div><h3>2 \u00b7 Choose the flip-flop</h3><div class="row">${Object.keys(FF).map(k=>`<button class="chip2 ${S.pf&&S.ff===k?'on':''}" data-ff="${k}">${k} flip-flop</button>`).join('')}</div>${par}${dr}${cu}<div class="row" style="margin-top:1.3rem"><button id="go" class="go" ${ok?'':'disabled'}>Start design \u25b6</button><span id="hint" class="hint ${ok?'okk':''}">${ok?'Ready \u2013 press Start design.':'Select a counter type and a flip-flop to continue.'}</span></div>`}}]}

function designSlides(){
 const n=D.n,hm=D.md.hasM,sq=seqList(),U=D.md.states.size,P=D.pins,qs=names(n),rip=S.type==='ripple';
 const ED=[];for(const m of hm?[1,0]:[0])sq.forEach(s=>ED.push({s,m,nx:D.md.f(s,m)}));
 const keys=[];for(let i=n-1;i>=0;i--)P.forEach(p=>keys.push(p+i));
 const exp=k=>`${k} = ${pr(D.eqs[k])}`,mh=hm?['M']:[];
 const rows=D.rows,ib=(r,i)=>P.map(p=>String(r.ex[p+i]).toUpperCase());
 const out=[
 {t:'Step 1 \u00b7 Counting sequence and number of flip-flops',n:3,f:u=>bul([`Required sequence:<div class="eq">${sq.map(s=>bin(s,n)).join(' \u2192 ')} \u2192 ${bin(sq[0],n)}</div>${hm?'M = 1 counts up, M = 0 counts down.':''}`,`Number of states = ${U}.<br>n = \u2308log\u2082 ${U}\u2309 = <b>${n}</b> flip-flops.`,`Outputs: <b>${qs}</b> using <b>${S.ff}</b> flip-flops.${D.unused.length?`<br>Unused states (don\u2019t-cares): <b>${D.unused.map(s=>bin(s,n)).join(', ')}</b>`:'<br>All states are used.'}`],u)},
 {t:'Step 2 \u00b7 State diagram and present state \u2192 next state table',n:ED.length+1+(D.unused.length?1:0),f:u=>{const r=Math.min(u,ED.length);return`<div class="cols"><div>${stateDiagram(ED,r,u>ED.length)}<p class="mu">Each Next adds one transition. Amber arrow = latest.${hm?' Green = UP, purple = DOWN.':''}${u>ED.length?' Dashed grey = unused states.':''}</p></div><div>${r?tbl([...mh,'Present '+qs,'Next '+qs],ED.slice(0,r).map(e=>[...(hm?[e.m?'UP':'DN']:[]),bin(e.s,n),bin(e.nx,n)]),r-1):'<p class="mu">Table is empty: press Next.</p>'}${u>ED.length?`<p>Unused states move to: ${D.unused.map(s=>bin(s,n)+'\u2192'+bin(nextOf(s,hm?S.dir:0),n)).join(', ')}</p>`:''}</div></div>`}},
 {t:`Step 3 \u00b7 ${S.ff} flip-flop tables`,n:2,f:u=>u?`<h3>Excitation table</h3>${ffExc()}`:`<h3>Characteristic equation and table</h3>${ffChar()}`},
 {t:'Step 4 \u00b7 Counter excitation table',n:rows.length,f:u=>{const r=rows[u];return`<div class="cols"><div>${tbl([...mh,'Present state','Next state',...Array.from({length:n},(_,i)=>P.map(p=>p+(n-1-i))).flat()],rows.slice(0,u+1).map(r=>[...(hm?[r.m?'UP':'DN']:[]),bin(r.s,n),bin(r.nx,n),...Array.from({length:n},(_,i)=>ib(r,n-1-i)).flat()]),u)}</div><div><h3>Row ${u+1}: ${bin(r.s,n)} \u2192 ${bin(r.nx,n)}</h3>${Array.from({length:n},(_,i)=>{const b=n-1-i;return`<div class="eq">Q${b}: ${(r.s>>b)&1} \u2192 ${(r.nx>>b)&1} \u21d2 ${P.map((p,j)=>p+b+' = '+ib(r,b)[j]).join(', ')}</div>`}).join('')}<p class="mu">Inputs are read from the ${S.ff} excitation table.</p></div></div>`}},
 rip?{t:'Step 5 \u00b7 Expressions (ripple counter)',n:1,f:()=>`<p style="font-size:1.5rem">A ripple counter needs no K-map: every stage toggles.</p>${keys.map(k=>`<div class="eq">${exp(k)}</div>`).join('')}<p style="font-size:1.3rem">FF0 is clocked by CP; each next flip-flop is clocked by the previous Q\u2032.</p>`}
 :{t:'Step 5 \u00b7 K-map simplification',n:keys.length+1,f:u=>{if(u===keys.length)return`<h3>Simplified expressions from the K-maps</h3>${keys.map(k=>`<div class="eq">${exp(k)}</div>`).join('')}<p class="mu">These expressions alone are used to draw the logic diagram.</p>`;
   const k=keys[u],eq=D.eqs[k],tm=eq==='0'?[]:eq.split(' + ');S.kmTerm=-1;
   return`<div class="cols"><div><h3>K-map for ${k}</h3><div class="row">${kmapHTML(k)}</div><p class="mu">Each coloured loop (adjacent 1s / X, size 1, 2, 4, 8) becomes one product term; variables that change inside a loop drop out.</p><div class="row">${k} = ${tm.map((t,i)=>`<span class="chip" style="border-color:${KC[i%6]}">${pr(t)}</span>`).join(' + ')||'0'}</div></div><div><h3>Expressions so far</h3>${keys.slice(0,u+1).map(x=>`<div class="eq">${exp(x)}</div>`).join('')}</div></div>`}},
 {t:'Step 6 \u00b7 Logic diagram from the expressions',n:n+1,f:u=>{S.k=Math.min(S.k,S.hist.length-1);return`${circuit(u,'svgL',true)}<div style="margin-top:.6rem">${u===0?'<p style="font-size:1.3rem">Place the flip-flops and connect the common clock CP'+(rip?' (ripple: FF0 only, others use the previous Q\u2032)':'')+'. Next wires each flip-flop from its expression.</p>':`<h3>FF${u-1} \u2013 wired from</h3>${P.map(p=>`<div class="eq">${exp(p+(u-1))}</div>`).join('')}<p class="mu">Each product term \u2192 AND gate (Q from the Q output, Q\u2032 from Q\u2032); several terms \u2192 OR gate; HIGH = logic 1.</p>`}</div>`}},
 {t:'Step 7 \u00b7 Counter operation',n:sq.length+1,f:u=>{simTo(u);const c=S.hist[u],pv=S.hist[u-1],tg=pv?c.s^pv.s:0;return`${hm?`<div class="row" style="margin-bottom:.5rem">Direction: ${chips([1,0],S.dir,'data-od',k=>k?'UP':'DOWN')}</div>`:''}<div class="cols"><div>${circuit(n,'svgO',true)}</div><div>${LED(c.s,n,tg)}<div class="leds"><div class="led"><div class="big">${bin(c.s,n)}</div>binary</div><div class="led"><div class="big">${c.s}</div>decimal</div></div><p class="mu" style="text-align:center">Clock pulse ${u}. Amber outline = flip-flop that toggled.</p></div></div>${wave()}`}},
 {t:'Summary',n:1,f:()=>`<p style="font-size:1.4rem">${n}-bit ${TYPES[S.type]}${S.type==='modn'?' (MOD-'+S.N+')':''} counter with ${S.ff} flip-flops.</p>${keys.map(k=>`<div class="eq">${exp(k)}</div>`).join('')}<p style="font-size:1.3rem">Sequence: ${sq.map(s=>bin(s,n)).join(' \u2192 ')} \u2192 ${bin(sq[0],n)}</p>`}];
 out.forEach((s,i)=>s.st=i+1);return out;}

/* ---- Navigation ---- */
function startDesign(){D=synth();if(D.md.err){alert(D.md.err);return false}S.hist=[{s:D.md.start,m:S.dir}];S.k=0;SL=SL.slice(0,selIdx+1).concat(designSlides());fillJump();return true}
function fillJump(){$('#jump').innerHTML=SL.map((s,i)=>s.t?`<option value="${i}">${i}. ${s.t}</option>`:'').join('')}
function stepper(k){return`<div class="stp">${STEPS.map((x,i)=>`<button data-st="${i+1}" class="stc ${i+1<k?'done':i+1===k?'now':''}">${i+1<k?'\u2713 ':(i+1)+' '}${x}</button>`).join('')}</div>`}
let heroT=null;
function heroStart(){clearInterval(heroT);let c=0;heroT=setInterval(()=>{c=(c+1)&7;document.querySelectorAll('#hero .led').forEach((l,k)=>l.classList.toggle('hi',!!((c>>(2-k))&1)));const t=document.getElementById('heroN');if(t)t.textContent=bin(c,3)+' = '+c},800)}
function fit(){const sc=$('#sc');if(!sc)return;sc.style.transform='';sc.style.width='';const k=Math.min(1,822/sc.scrollHeight,1488/Math.max(sc.scrollWidth,1488));if(k<1){sc.style.transform=`scale(${k})`;sc.style.transformOrigin='top left';sc.style.width=(100/k)+'%'}}
function scaleSlide(){const w=$('#wrap').clientWidth,h=$('#wrap').clientHeight,k=Math.min(w/1600,h/900),s=$('#slide');s.style.transform=`scale(${k})`;s.style.left=(w-1600*k)/2+'px';s.style.top=(h-900*k)/2+'px'}
function render(){const sl=SL[pos.s],st=$('#stage'),ch=pos.s!==lastS;st.classList.toggle('enter',ch);lastS=pos.s;
 st.innerHTML=`<div id="sc">${sl.st?stepper(sl.st):''}${sl.t?`<h1>${sl.t}</h1>`:''}${sl.f(pos.u)}</div>`;$('#jump').value=pos.s;
 $('#prog').textContent=`Slide ${pos.s+1}/${SL.length} \u00b7 step ${pos.u+1}/${sl.n}`;$('#fill').style.width=((pos.s+(pos.u+1)/sl.n)/SL.length*100)+'%';$('#sn').textContent=`${pos.s+1} / ${SL.length}`;
 clearInterval(heroT);if(pos.s===0)heroStart();try{fit()}catch(e){}}
function tryStart(){if(!(S.pt&&S.pf)){stopAuto();render();const h=$('#hint');if(h)h.classList.add('warn');return false}if(!startDesign())return false;pos={s:selIdx+1,u:0};render();return true}
function next(){const sl=SL[pos.s];if(sl.key==='select'){if(autoT)stopAuto();else tryStart();return}if(pos.u<sl.n-1)pos.u++;else if(pos.s<SL.length-1){pos.s++;pos.u=0}else stopAuto();render()}
function prev(){if(pos.u>0)pos.u--;else if(pos.s>0){pos.s--;pos.u=SL[pos.s].n-1}render()}
function stopAuto(){clearInterval(autoT);autoT=null;$('#auto').textContent='\u25b6 Auto'}
$('#nx').onclick=next;$('#pv').onclick=prev;$('#all').onclick=()=>{pos.u=SL[pos.s].n-1;render()};
$('#auto').onclick=()=>{if(autoT)stopAuto();else{$('#auto').textContent='\u23f8 Pause';autoT=setInterval(next,1500)}};
$('#jump').onchange=e=>{pos={s:+e.target.value,u:0};render()};
const theme=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'},full=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$('#th').onclick=theme;$('#fs').onclick=full;
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if(e.key==='ArrowRight'||k===' '||e.key==='PageDown'){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp')prev();else if(k==='f')full();else if(k==='t')theme();else if(k==='h')document.body.classList.toggle('clean')});
$('#stage').addEventListener('click',e=>{const bt=e.target.closest('button'),d=bt?bt.dataset:{},id=bt?bt.id:'';if(!bt)return;
 if(d.st){const i=SL.findIndex(s=>s.st===+d.st);if(i>=0){pos={s:i,u:0};render()}return}
 if(id==='go'){tryStart();return}
 let sel=true;
 if(d.ty){S.type=d.ty;S.pt=true}else if(d.ff){S.ff=d.ff;S.pf=true}else if(d.nb)S.n=+d.nb;else if(d.dir!==undefined)S.dir=+d.dir;
 else if(id==='lf')S.lfsr=!S.lfsr;else if(id==='rnd'){S.lfsr=false;const M=2**S.n;S.cust=shuf0([...Array(M).keys()]).slice(0,Math.max(3,Math.floor(M*.75))).map(x=>bin(x,S.n)).join(',')}
 else if(d.od!==undefined){S.dir=+d.od;S.hist=S.hist.slice(0,S.k+1);sel=false}else return;
 if(sel){SL=SL.slice(0,selIdx+1);fillJump()}render()});
const shuf0=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
$('#stage').addEventListener('change',e=>{if(e.target.id==='modN')S.N=Math.min(16,Math.max(2,+e.target.value||6));if(e.target.id==='cust'){S.cust=e.target.value;S.lfsr=false}});
scaleSlide();addEventListener('resize',()=>{scaleSlide();try{fit()}catch(e){}});
SL=baseSlides();selIdx=SL.findIndex(s=>s.key==='select');fillJump();render();
</script></body></html>
